# Deploy the public site to GitHub Pages:
#   /         -> the Ranger playground (compile Ranger in the browser)
#   /games/   -> the Ranger game engine compiled to JavaScript, running games
#                in the browser via a virtual filesystem (Pong today; the WASM
#                car game + a GPU 3D demo are the next entries).
#   /games/v2/ -> v2 interpreter live demos (staged ComponentEngine +
#                RgRegistryBridge / RgGameHost — ylos2 2D + live 3D guests).
#   /evg/     -> the EVG showcase: the layout engine's own example pages, each
#                rendered under two themes and to PDF, PNG and HTML from one
#                source tree and one stylesheet.
#   /pptx/    -> the PowerPoint viewer and editor, running with no server: the
#                deck is parsed and drawn in the page (OPC/ZIP →
#                PresentationML → EVGDisplayList → WebGL 2), and it opens
#                ready to edit. Works on a phone — the chrome folds at
#                breakpoints the app's own stylesheet states.
#   /pptx-wasm/ -> the SAME editor as /pptx/, compiled the other way: Ranger →
#                C++ → WebAssembly (Emscripten) rather than Ranger →
#                JavaScript. One source file, two backends, and the page —
#                standalone.mjs — is the same file in both, so the two URLs
#                differ in exactly one thing and can be compared. It is a path
#                in THIS artifact and not a workflow of its own because GitHub
#                Pages allows one deployment per repository: a second
#                deployer would clobber the site rather than sit beside it.
#   /vela/    -> paste a Vega or Vega-Lite specification and see what the
#                Ranger runtime draws. The compiler and the SVG renderer it
#                loads are built from gallery/vela/src, so the page shows this
#                commit's own output rather than a recorded one.
#   /office/  -> the .pptx API playground: code on the left writing a deck, the
#                editor on the right opening the bytes it produced. Its
#                documentation is at /office/docs/ (Astro + Starlight: EVG,
#                PowerPoint, charts, Word, Excel, diagrams, and the generated
#                API pages). The HTML dump of those APIs is at
#                /office/reference/. Both are built HERE rather than into
#                /docs/ because they quote AGPL comments and the language
#                documentation is MIT.
#   /docs/    -> the language documentation. The operator reference is generated
#                from compiler/Lang.rgr and lib/*.rgr by docs/tools, and the
#                examples on it are compiled by the compiler built in this job,
#                so the docs cannot drift from the release they ship with.
#
# This is the single Pages deployer for the repo (it supersedes the old
# deploy-playground.yml). GitHub Pages allows one deployment per repository, so
# both surfaces are assembled into one artifact here to avoid clobbering.
#
# REQUIRED repo setting (Settings → Pages → Build and deployment → Source):
#   GitHub Actions
# If Source is still "Deploy from a branch" (master /), GitHub also runs the
# automatic pages-build-deployment / jekyll-build-pages job on every push. That
# legacy Jekyll pass reads docs/site/**/*.astro `---` blocks as YAML and fails
# (Invalid YAML front matter). Do not "fix" that by adding a root .nojekyll or
# a Jekyll _config.yml that makes the branch builder succeed — it would publish
# the raw master tree and clobber this workflow's artifact. Switch Source to
# GitHub Actions so only this workflow deploys.
#
# Runs automatically on pushes to master that touch the site, and can be run
# independently at any time from the Actions tab (workflow_dispatch).
name: Deploy site (playground + games) to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "playground/**"
      - "gallery/game_engine/web/**"
      - "gallery/game_engine/v2/**"
      - "gallery/game_engine/tests/pong_runner_demo.rgr"
      - "gallery/game_engine/scripting/**"
      - "compiler/**"
      - "lib/**"
      - "docs/**"
      - "gallery/evg/**"
      - "gallery/vela/**"
      # These carry the deck editor, the API playground, the Office
      # documentation at /office/docs/, and the API dump at
      # /office/reference/ — so a change to a facade republishes the docs
      # without docs/ (the MIT language site) being touched.
      - "gallery/pptx/**"
      - "gallery/office/**"
      - "gallery/pdf_writer/src/**"
      - ".github/workflows/deploy-pages.yml"
  # A published release republishes the site, so the documentation on
  # /docs/ always describes the released compiler.
  release:
    types: [published]
  workflow_dispatch:

# The Emscripten release the WebAssembly editor is built with. Pinned rather
# than `latest` so a site deploy cannot change the engine's compiler under it,
# and so the cache key means something. This is the release the two engines
# were checked against — `node gallery/pptx/web/wasm/parity.mjs`, 61 236
# display-list commands identical — so moving it is a change to verify, not a
# number to bump.
env:
  EMSDK_VERSION: "6.0.8"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Build Ranger compiler
        run: npm run compile

      # ---- Games site: engine -> JS + packaged game zips + Monaco editor -
      - name: Install games-site dependencies (Monaco + esbuild)
        working-directory: gallery/game_engine/web
        run: npm ci

      - name: Build games site
        run: node gallery/game_engine/web/build.mjs --out "$GITHUB_WORKSPACE/_site/games"

      # ---- 3D model viewer demo (glTF -> SoftRenderer3D, host-side) -------
      - name: Build 3D model demo
        run: node gallery/game_engine/web/build-model3d.mjs --out "$GITHUB_WORKSPACE/_site/games/model3d"

      # ---- Three.js cube on the GPU (.tsx interpreter -> Ranger Three -> WebGL)
      - name: Build tsx3d WebGL demo
        run: node gallery/game_engine/web/build-tsx3d.mjs --out "$GITHUB_WORKSPACE/_site/games/tsx3d"

      # ---- v2 interpreter live demos + Monaco editor (ComponentEngine migrate/src)
      - name: Install v2 games-site dependencies (Monaco + esbuild)
        working-directory: gallery/game_engine/v2/web
        run: npm ci

      - name: Build v2 interpreter Pages demos
        run: node gallery/game_engine/v2/web/build-pages.mjs --out "$GITHUB_WORKSPACE/_site/games/v2"

      # ---- Documentation site at /docs/ ----------------------------------
      - name: Install documentation dependencies
        working-directory: docs/site
        run: npm ci

      - name: Restore the example compilation cache
        uses: actions/cache@v4
        with:
          path: docs/.cache
          key: docs-examples-${{ hashFiles('compiler/**/*.rgr', 'lib/**/*.rgr', 'docs/examples/**') }}
          restore-keys: |
            docs-examples-

      - name: Generate the operator reference
        run: npm run docs:generate
        env:
          # Source links pin to this commit so line numbers stay correct when
          # Lang.rgr moves on master after the pages are generated.
          RANGER_COMMIT: ${{ github.sha }}

      - name: Build the documentation site
        working-directory: docs/site
        run: npm run build
        env:
          RANGER_COMMIT: ${{ github.sha }}
          RANGER_RELEASE: ${{ github.event_name == 'release' }}

      - name: Copy the documentation into the site
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_site/docs"
          cp -r docs/site/dist/. "$GITHUB_WORKSPACE/_site/docs/"

      # ---- EVG showcase at /evg/ -----------------------------------------
      # Renders the layout engine's own example pages with the tools built
      # from this checkout, so the gallery always shows what the engine in
      # this commit actually does.
      - name: Build the EVG showcase
        run: node gallery/evg/showcase/build.mjs --out "$GITHUB_WORKSPACE/_site/evg"

      # ---- .pptx API playground at /office/ -------------------------------
      # The published API and the slide editor in one page: the code writes a
      # deck, the editor opens the BYTES it produced. A build here proves the
      # writer and the reader agree, which no unit test on either alone does.
      - name: Build the Office API playground
        run: bash gallery/pptx/web/playground/build.sh --out "$GITHUB_WORKSPACE/_site/office"

      # ---- Office docs at /office/docs/ + API dump at /office/reference/ --
      # Beside the playground they document and under the same licence as the
      # code they are built from. `npm run docs:generate` does not build them —
      # see gallery/office/docs/README.md.
      - name: Build the Office API dump
        run: bash gallery/office/docs/build.sh --out "$GITHUB_WORKSPACE/_site/office/reference"

      - name: Install Office documentation dependencies
        working-directory: gallery/office/docs/site
        run: npm ci

      - name: Build the Office documentation site
        working-directory: gallery/office/docs/site
        run: npm run build
        env:
          RANGER_COMMIT: ${{ github.sha }}

      - name: Copy the Office documentation into the site
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_site/office/docs"
          cp -r gallery/office/docs/site/dist/. "$GITHUB_WORKSPACE/_site/office/docs/"
          test -s "$GITHUB_WORKSPACE/_site/office/docs/index.html"
          test -s "$GITHUB_WORKSPACE/_site/office/docs/evg/index.html"

      # The same check the deck editor gets below, for the same reason: a page
      # whose engine failed to copy looks exactly like one whose engine failed
      # to compile, and both look fine until someone opens them.
      - name: Check the Office API playground has an engine
        run: |
          test -s "$GITHUB_WORKSPACE/_site/office/reference/index.html"
          test -s "$GITHUB_WORKSPACE/_site/office/reference/pptx/index.html"
          test -s "$GITHUB_WORKSPACE/_site/office/reference/charts/index.html"
          test -s "$GITHUB_WORKSPACE/_site/office/docs/index.html"
          test -s "$GITHUB_WORKSPACE/_site/office/pptx_playground.js"
          test -s "$GITHUB_WORKSPACE/_site/office/playground.mjs"
          test -s "$GITHUB_WORKSPACE/_site/office/gl/evg-webgl.js"
          test -s "$GITHUB_WORKSPACE/_site/office/presets.txt"
          grep -q "PptxApi" "$GITHUB_WORKSPACE/_site/office/pptx_playground.js"
          grep -q "PptxWeb" "$GITHUB_WORKSPACE/_site/office/pptx_playground.js"

      # ---- Vela playground at /vela/ --------------------------------------
      # Paste a Vega or Vega-Lite specification and see what the Ranger
      # runtime draws. The script it loads is compiled from the same sources
      # the C++ build uses, so the page shows this commit's own renderer.
      - name: Build the Vela page
        run: bash gallery/vela/web/build.sh --out "$GITHUB_WORKSPACE/_site/vela"

      # ---- PPTX playground at /pptx/ --------------------------------------
      # The viewer and editor with no server behind them: the page fetches a
      # deck, parses the package and draws it, and everything after that —
      # editing, undo, the show, saving a .pptx back out — happens in the tab.
      # Nothing is uploaded, which is the point of shipping it as a static
      # page rather than as a service.
      - name: Build the PPTX playground
        run: bash gallery/pptx/web/standalone/build.sh --out "$GITHUB_WORKSPACE/_site/pptx"

      # A page whose engine failed to copy looks exactly like a page whose
      # engine failed to compile, and both look fine until someone opens
      # them. The build script checks its own output; this checks that what
      # the artifact will actually carry is there.
      - name: Check the PPTX playground has an engine
        run: |
          test -s "$GITHUB_WORKSPACE/_site/pptx/pptx_web.js"
          test -s "$GITHUB_WORKSPACE/_site/pptx/standalone.mjs"
          test -s "$GITHUB_WORKSPACE/_site/pptx/gl/evg-webgl.js"
          test -s "$GITHUB_WORKSPACE/_site/pptx/deck.pptx"
          grep -q "PptxWeb" "$GITHUB_WORKSPACE/_site/pptx/pptx_web.js"

      # ---- The same editor, as WebAssembly, at /pptx-wasm/ ----------------
      # Ranger -> C++ -> Emscripten -> WASM. This is the only route that
      # carries a program this size today: the direct LLVM/WAT backend is
      # freestanding (primitives, no strings or objects), and the Rust backend
      # gets through the Ranger frontend but emits Rust that does not yet
      # compile — see RUST_ISSUES.md for the taxonomy.
      #
      # emsdk is installed rather than pulled from a third-party action, and
      # cached on the SDK version so a site deploy does not re-download 300 MB
      # of toolchain every time.
      - name: Cache the Emscripten SDK
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Install the Emscripten SDK
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Build the WebAssembly editor
        run: |
          # shellcheck disable=SC1091
          source ~/emsdk/emsdk_env.sh
          bash gallery/pptx/web/wasm/build.sh --out "$GITHUB_WORKSPACE/_site/pptx-wasm"

      # Does the WebAssembly engine draw the same picture as the JavaScript
      # one? Every fixture, every slide, command by command and field by
      # field. This is the check that caught `-fno-exceptions` turning a
      # `catch (...)` in the Ranger runtime into an abort on one deck — a
      # fault no amount of looking at the page would have found, because the
      # page it broke was not the one anybody opens.
      - name: Check the two engines agree
        run: |
          # shellcheck disable=SC1091
          source ~/emsdk/emsdk_env.sh
          # The chart deck the comparison is really about is built from the
          # playground's preset through the published JavaScript API, and that
          # package is generated rather than checked in. Nothing earlier in
          # this job builds it.
          bash gallery/pptx/api/js/build.sh
          node gallery/pptx/web/wasm/parity.mjs

      # And that what the artifact will actually carry is there. A page whose
      # engine failed to copy looks exactly like one whose engine failed to
      # compile, and both look fine until someone opens them.
      - name: Check the WebAssembly page has an engine
        run: |
          test -s "$GITHUB_WORKSPACE/_site/pptx-wasm/pptx_wasm.wasm"
          test -s "$GITHUB_WORKSPACE/_site/pptx-wasm/pptx_wasm.mjs"
          test -s "$GITHUB_WORKSPACE/_site/pptx-wasm/wasm-host.mjs"
          test -s "$GITHUB_WORKSPACE/_site/pptx-wasm/standalone.mjs"
          test -s "$GITHUB_WORKSPACE/_site/pptx-wasm/gl/evg-webgl.js"
          test -s "$GITHUB_WORKSPACE/_site/pptx-wasm/deck.pptx"
          # The page must NOT have picked up the JavaScript engine as well —
          # that would publish a page that looks like it runs on WebAssembly
          # and does not.
          test ! -e "$GITHUB_WORKSPACE/_site/pptx-wasm/pptx_web.js"
          grep -q "installPptxWeb" "$GITHUB_WORKSPACE/_site/pptx-wasm/index.html"

      # ---- Playground at the site root -----------------------------------
      - name: Install playground dependencies
        working-directory: playground
        run: npm ci

      - name: Build playground
        working-directory: playground
        run: npm run build

      - name: Assemble site root
        run: |
          # Copy the playground build to the site root, preserving _site/games.
          cp -r playground/dist/. "$GITHUB_WORKSPACE/_site/"
          # The docs build emits /docs/_astro/. A Jekyll pass would drop every
          # underscore-prefixed directory, so mark the artifact as not-Jekyll.
          touch "$GITHUB_WORKSPACE/_site/.nojekyll"
          echo "Site contents:"
          find "$GITHUB_WORKSPACE/_site" -maxdepth 2 -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
