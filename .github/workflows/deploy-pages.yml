# Deploy the public site to GitHub Pages:
#   /         -> the Ranger playground (compile Ranger in the browser)
#   /games/   -> the Ranger game engine compiled to JavaScript, running games
#                in the browser via a virtual filesystem (Pong today; the WASM
#                car game + a GPU 3D demo are the next entries).
#   /games/v2/ -> v2 interpreter live demos (staged ComponentEngine +
#                RgRegistryBridge / RgGameHost — ylos2 2D + live 3D guests).
#   /evg/     -> the EVG showcase: the layout engine's own example pages, each
#                rendered under two themes and to PDF, PNG and HTML from one
#                source tree and one stylesheet.
#   /pptx/    -> the PowerPoint viewer and editor, running with no server: the
#                deck is parsed and drawn in the page (OPC/ZIP →
#                PresentationML → EVGDisplayList → WebGL 2), and it opens
#                ready to edit. Works on a phone — the chrome folds at
#                breakpoints the app's own stylesheet states.
#   /pptx-wasm/ -> the SAME editor as /pptx/, compiled the other way: Ranger →
#                C++ → WebAssembly (Emscripten) rather than Ranger →
#                JavaScript. One source file, two backends, and the page —
#                standalone.mjs — is the same file in both, so the two URLs
#                differ in exactly one thing and can be compared. It is a path
#                in THIS artifact and not a workflow of its own because GitHub
#                Pages allows one deployment per repository: a second
#                deployer would clobber the site rather than sit beside it.
#   /vela/    -> paste a Vega or Vega-Lite specification and see what the
#                Ranger runtime draws. The compiler and the SVG renderer it
#                loads are built from gallery/vela/src, so the page shows this
#                commit's own output rather than a recorded one.
#   /office/  -> the .pptx API playground: code on the left writing a deck, the
#                editor on the right opening the bytes it produced. Its
#                reference is at /office/reference/ (Astro + Starlight: EVG,
#                PowerPoint, charts, Word, Excel, diagrams, and the generated
#                API pages). It is built HERE rather than into /docs/ because
#                it quotes AGPL comments and the language documentation is MIT.
#   /realtrainer/ -> the RealTrainer port: a phone app drawn by EVG's WebGL
#                painter, measured screen by screen against the original. The
#                page is the window — one tree, and the stylesheet's @media
#                blocks fold the rail or the bottom bar at 768px — so it is
#                the phone app on a phone and the desktop app on a desktop.
#                The app runs in a Worker and its frames are painted on the
#                main thread (evg-engine.js); ?engine=main keeps it on the
#                main thread, and ?painter=dom — which paints the same app as
#                DOM nodes kept across frames (gallery/evg/html/evg-dom.js on
#                EVGHostTree) — requires that. The document carries a picture
#                of the app's chrome, computed in the build from its own
#                display list (web/snapshot.mjs), so nothing is blank while
#                the bundle is on its way.
#                /evg/responsive/?painter=dom is the same painter on the
#                responsive page.
#   /rangerflow/ -> the node-graph editor: a database schema parsed from a .sql
#                file in the tab, a UML class diagram, a swimlane process — and
#                a box you paste Mermaid into, rendered by RangerFlow's own
#                reader, laid out by its own layered layout and drawn on the
#                GPU. Every demo in the dropdown is checked on every push by
#                `rangerflow:web:test`, which drives this same page in headless
#                Chrome.
#   /figma/   -> the Figma .fig / .deck reader: it opens on a real Figma
#                export (fixtures/health.fig) and takes any other file you
#                upload or paste in the tab, parsing it (ZIP → kiwi → node
#                tree) and drawing it with EVG. ?file=sample opens the deck
#                Ranger builds in memory instead.
#                Timed against OpenFig on the same bytes when that library
#                is present; the sample deck is built from Ranger.
#   /markdown/ -> the markdown viewer: a CommonMark parser written in Ranger,
#                laid out by its own line breaker and drawn on the GPU. Type in
#                the left pane and the right one redraws; ```mermaid fences are
#                read by RangerFlow's reader and land on the page as geometry,
#                not as pictures. **Download PDF** builds the file in the tab —
#                sheets, page breaks and embedded fonts — with no server.
#   /docs/    -> the language documentation. The operator reference is generated
#                from compiler/Lang.rgr and lib/*.rgr by docs/tools, and the
#                examples on it are compiled by the compiler built in this job,
#                so the docs cannot drift from the release they ship with.
#
# This is the single Pages deployer for the repo (it supersedes the old
# deploy-playground.yml). GitHub Pages allows one deployment per repository, so
# both surfaces are assembled into one artifact here to avoid clobbering.
#
# REQUIRED repo setting (Settings → Pages → Build and deployment → Source):
#   GitHub Actions
# If Source is still "Deploy from a branch" (master /), GitHub also runs the
# automatic pages-build-deployment / jekyll-build-pages job on every push. That
# legacy Jekyll pass reads docs/site/**/*.astro `---` blocks as YAML and fails
# (Invalid YAML front matter). Do not "fix" that by adding a root .nojekyll or
# a Jekyll _config.yml that makes the branch builder succeed — it would publish
# the raw master tree and clobber this workflow's artifact. Switch Source to
# GitHub Actions so only this workflow deploys.
#
# Runs automatically on pushes to master that touch the site, and can be run
# independently at any time from the Actions tab (workflow_dispatch).
name: Deploy site (playground + games) to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "playground/**"
      - "gallery/game_engine/web/**"
      - "gallery/game_engine/v2/**"
      - "gallery/game_engine/tests/pong_runner_demo.rgr"
      - "gallery/game_engine/scripting/**"
      - "compiler/**"
      - "lib/**"
      - "docs/**"
      - "gallery/evg/**"
      - "gallery/vela/**"
      # The RealTrainer page at /realtrainer/ is built from these, and from
      # the controls in gallery/ui it is drawn with.
      - "gallery/realtrainer/**"
      # The firesim console at /firesim/ is built from these.
      - "gallery/firesim/**"
      - "gallery/ui/**"
      # These carry the deck editor, the API playground, and the Office
      # reference at /office/reference/ — so a change to a facade republishes
      # the docs without docs/ (the MIT language site) being touched.
      - "gallery/pptx/**"
      - "gallery/office/**"
      # The deck viewer opens a .odp too, and the reader under it lives in
      # three directories of its own. Without these a change to the ODF side
      # would leave /pptx/ on the site describing a viewer it no longer is.
      - "gallery/odp/**"
      - "gallery/odf/**"
      - "gallery/xml/**"
      - "gallery/pdf_writer/src/**"
      - "gallery/figma/**"
      # The graph editor at /rangerflow/ is built from these — the domains it
      # reads (SQL, UML, Mermaid), the layout and the exporters included.
      - "gallery/rangerflow/**"
      # The markdown viewer at /markdown/. It draws its diagrams through
      # rangerflow's Mermaid reader, which is why that path is above this one.
      - "gallery/markdown/**"
      - "gallery/zip/**"
      - ".github/workflows/deploy-pages.yml"
  # A published release republishes the site, so the documentation on
  # /docs/ always describes the released compiler.
  release:
    types: [published]
  workflow_dispatch:

# The Emscripten release the WebAssembly editor is built with. Pinned rather
# than `latest` so a site deploy cannot change the engine's compiler under it,
# and so the cache key means something. This is the release the two engines
# were checked against — `node gallery/pptx/web/wasm/parity.mjs`, 61 236
# display-list commands identical — so moving it is a change to verify, not a
# number to bump.
env:
  EMSDK_VERSION: "6.0.8"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Build Ranger compiler
        run: npm run compile

      # ---- Games site: engine -> JS + packaged game zips + Monaco editor -
      - name: Install games-site dependencies (Monaco + esbuild)
        working-directory: gallery/game_engine/web
        run: npm ci

      - name: Build games site
        run: node gallery/game_engine/web/build.mjs --out "$GITHUB_WORKSPACE/_site/games"

      # ---- 3D model viewer demo (glTF -> SoftRenderer3D, host-side) -------
      - name: Build 3D model demo
        run: node gallery/game_engine/web/build-model3d.mjs --out "$GITHUB_WORKSPACE/_site/games/model3d"

      # ---- Three.js cube on the GPU (.tsx interpreter -> Ranger Three -> WebGL)
      - name: Build tsx3d WebGL demo
        run: node gallery/game_engine/web/build-tsx3d.mjs --out "$GITHUB_WORKSPACE/_site/games/tsx3d"

      # ---- v2 interpreter live demos + Monaco editor (ComponentEngine migrate/src)
      - name: Install v2 games-site dependencies (Monaco + esbuild)
        working-directory: gallery/game_engine/v2/web
        run: npm ci

      - name: Build v2 interpreter Pages demos
        run: node gallery/game_engine/v2/web/build-pages.mjs --out "$GITHUB_WORKSPACE/_site/games/v2"

      # ---- Documentation site at /docs/ ----------------------------------
      - name: Install documentation dependencies
        working-directory: docs/site
        run: npm ci

      - name: Restore the example compilation cache
        uses: actions/cache@v4
        with:
          path: docs/.cache
          key: docs-examples-${{ hashFiles('compiler/**/*.rgr', 'lib/**/*.rgr', 'docs/examples/**') }}
          restore-keys: |
            docs-examples-

      - name: Generate the operator reference
        run: npm run docs:generate
        env:
          # Source links pin to this commit so line numbers stay correct when
          # Lang.rgr moves on master after the pages are generated.
          RANGER_COMMIT: ${{ github.sha }}

      - name: Build the documentation site
        working-directory: docs/site
        run: npm run build
        env:
          RANGER_COMMIT: ${{ github.sha }}
          RANGER_RELEASE: ${{ github.event_name == 'release' }}

      - name: Copy the documentation into the site
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_site/docs"
          cp -r docs/site/dist/. "$GITHUB_WORKSPACE/_site/docs/"

      # ---- EVG showcase at /evg/ -----------------------------------------
      # Renders the layout engine's own example pages with the tools built
      # from this checkout, so the gallery always shows what the engine in
      # this commit actually does.
      - name: Build the EVG showcase
        run: node gallery/evg/showcase/build.mjs --out "$GITHUB_WORKSPACE/_site/evg"

      # ---- RealTrainer at /realtrainer/ -----------------------------------
      # The app compiled to JavaScript and bundled with the painter; the page
      # loads one script. `rt:build` needs the compiler built above, and the
      # bundler comes with the conformance host's dependencies.
      - name: Install conformance-host dependencies (esbuild)
        run: npm run ui:conformance:install
      - name: Build RealTrainer
        run: |
          npm run rt:build --silent
          node gallery/realtrainer/web/build.mjs --out "$GITHUB_WORKSPACE/_site/realtrainer"
          test -s "$GITHUB_WORKSPACE/_site/realtrainer/index.html"
          test -s "$GITHUB_WORKSPACE/_site/realtrainer/bundle.js"
          # The bundle is minified, so these are STRING LITERALS and not
          # identifiers: a minifier renames `createDomPainter` and cannot
          # touch the class name the DOM painter puts on every node it makes.
          # Assert on what survives, or this step goes green on an empty file.
          grep -q "RealTrainerDemo" "$GITHUB_WORKSPACE/_site/realtrainer/bundle.js"
          grep -q "evg-node" "$GITHUB_WORKSPACE/_site/realtrainer/bundle.js"
          test -s "$GITHUB_WORKSPACE/_site/realtrainer/bundle-worker.js"
          test -s "$GITHUB_WORKSPACE/_site/realtrainer/worker-bundle.js"
          # The reference data is a FILE beside the page now, fetched in
          # parallel with the bundle rather than compiled into it. A page
          # deployed without it draws a real screen with an empty diary, and
          # nothing else here would notice.
          test -s "$GITHUB_WORKSPACE/_site/realtrainer/seed.json"
          test -s "$GITHUB_WORKSPACE/_site/evg/responsive/evg-dom.js"

      # ---- the firesim workbench at /firesim/ ------------------------------
      # A database browser over the Firebase simulator. No bundler: the
      # compiled module is one self-contained file, so the page is a wrapper
      # and a copy of EVG's own browser helpers — which is the same claim the
      # simulator makes about itself, and why this step has no install.
      - name: Build the firesim workbench
        run: |
          npm run firesim:demo:build --silent
          node gallery/firesim/demo/build.mjs --out "$GITHUB_WORKSPACE/_site/firesim"
          test -s "$GITHUB_WORKSPACE/_site/firesim/index.html"
          test -s "$GITHUB_WORKSPACE/_site/firesim/generated-host.js"
          test -s "$GITHUB_WORKSPACE/_site/firesim/evg/gl/evg-webgl.js"
          grep -q "FiresimConsole" "$GITHUB_WORKSPACE/_site/firesim/generated-host.js"
          grep -q "FsRulesEval" "$GITHUB_WORKSPACE/_site/firesim/generated-host.js"
          test -s "$GITHUB_WORKSPACE/_site/firesim/datasets/realtrainer.json"
          test -s "$GITHUB_WORKSPACE/_site/firesim/datasets/realtrainer.rules"

      # ---- .pptx API playground at /office/ -------------------------------
      # The published API and the slide editor in one page: the code writes a
      # deck, the editor opens the BYTES it produced. A build here proves the
      # writer and the reader agree, which no unit test on either alone does.
      - name: Build the Office API playground
        run: bash gallery/pptx/web/playground/build.sh --out "$GITHUB_WORKSPACE/_site/office"

      # ---- Office reference at /office/reference/ --------------------------
      # Astro + Starlight, beside the playground it documents and under the
      # same licence as the code it quotes. `npm run docs:generate` does not
      # build this — see gallery/office/docs/README.md.
      - name: Generate the Office API pages
        run: bash gallery/office/docs/build.sh

      - name: Copy the playground into the Office docs
        run: OFFICE_PLAYGROUND_DIST="$GITHUB_WORKSPACE/_site/office" node gallery/office/docs/tools/sync-playground.mjs

      - name: Copy the Chart API page into the Office docs
        run: OFFICE_CHART_API_DIST="$GITHUB_WORKSPACE/_site/evg/chart-api" node gallery/office/docs/tools/sync-chart-api.mjs

      - name: Install Office documentation dependencies
        working-directory: gallery/office/docs/site
        run: npm ci

      - name: Build the Office documentation site
        working-directory: gallery/office/docs/site
        run: npm run build
        env:
          RANGER_COMMIT: ${{ github.sha }}

      - name: Copy the Office documentation into the site
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_site/office/reference"
          cp -r gallery/office/docs/site/dist/. "$GITHUB_WORKSPACE/_site/office/reference/"
          test -s "$GITHUB_WORKSPACE/_site/office/reference/index.html"
          test -s "$GITHUB_WORKSPACE/_site/office/reference/pptx/index.html"
          test -s "$GITHUB_WORKSPACE/_site/office/reference/evg/index.html"
          test -s "$GITHUB_WORKSPACE/_site/office/reference/playground/index.html"
          test -s "$GITHUB_WORKSPACE/_site/office/reference/playground/playground.mjs"
          test -s "$GITHUB_WORKSPACE/_site/office/reference/chart-api/index.html"
          test -s "$GITHUB_WORKSPACE/_site/office/reference/chart-api/vela_chart_api.js"
          grep -q "AGPL" "$GITHUB_WORKSPACE/_site/office/reference/index.html"

      # The same check the deck editor gets below, for the same reason: a page
      # whose engine failed to copy looks exactly like one whose engine failed
      # to compile, and both look fine until someone opens them.
      - name: Check the Office API playground has an engine
        run: |
          test -s "$GITHUB_WORKSPACE/_site/office/reference/index.html"
          test -s "$GITHUB_WORKSPACE/_site/office/reference/pptx/index.html"
          test -s "$GITHUB_WORKSPACE/_site/office/pptx_playground.js"
          test -s "$GITHUB_WORKSPACE/_site/office/playground.mjs"
          test -s "$GITHUB_WORKSPACE/_site/office/gl/evg-webgl.js"
          test -s "$GITHUB_WORKSPACE/_site/office/presets.txt"
          grep -q "PptxApi" "$GITHUB_WORKSPACE/_site/office/pptx_playground.js"
          grep -q "PptxWeb" "$GITHUB_WORKSPACE/_site/office/pptx_playground.js"

      # ---- Vela playground at /vela/ --------------------------------------
      # Paste a Vega or Vega-Lite specification and see what the Ranger
      # runtime draws. The script it loads is compiled from the same sources
      # the C++ build uses, so the page shows this commit's own renderer.
      # The chart API at /vela/api/ is built by each ecosystem's OWN tool --
      # documentation.js, pdoc, Dokka and dartdoc -- over the packages `-apipackage`
      # writes. That is the test PLAN_API_DOCS.md 7.3 sets: the target's own
      # tool reads Ranger's output with no Ranger plugin. So the toolchains are
      # installed here rather than the pages being rendered by us.
      #
      # Dokka resolves the Kotlin compiler and its own plugin from mavenCentral
      # through gradle, which is already on the runner. pdoc and documentation.js
      # are one install each.
      - name: Install the documentation toolchains
        run: |
          npm install --no-save --no-audit --no-fund documentation
          python3 -m pip install --quiet --disable-pip-version-check pdoc

      # Dart for dartdoc; gradle for Dokka is already on the runner.
      #
      # .NET and DocFX are NOT installed: C# is out of the API pipeline for
      # now. DocFX ran here, exited 0 and wrote _site/api/*.html with no
      # _site/index.html, so --require failed the whole deploy over a page
      # nobody could see. See the note in build-api-docs.mjs.
      - uses: dart-lang/setup-dart@v1

      - name: Build the Vela page
        run: bash gallery/vela/web/build.sh --out "$GITHUB_WORKSPACE/_site/vela"

      # --require fails the build when a toolchain is missing. Without it a
      # runner that lost one would publish a smaller site and say nothing --
      # the same silent-skip failure the formatter's own gate exists to avoid.
      - name: Check every API toolchain ran
        run: |
          node gallery/vela/web/build-api-docs.mjs \
            --out "$GITHUB_WORKSPACE/_site/vela/api" --require
          test -s "$GITHUB_WORKSPACE/_site/vela/api/index.html"
          test -s "$GITHUB_WORKSPACE/_site/vela/api/javascript/index.html"
          test -s "$GITHUB_WORKSPACE/_site/vela/api/python/vela_chart.html"
          test -s "$GITHUB_WORKSPACE/_site/vela/api/kotlin/index.html"
          test -s "$GITHUB_WORKSPACE/_site/vela/api/dart/index.html"

      # ---- PPTX playground at /pptx/ --------------------------------------
      # The viewer and editor with no server behind them: the page fetches a
      # deck, parses the package and draws it, and everything after that —
      # editing, undo, the show, saving a .pptx back out — happens in the tab.
      # Nothing is uploaded, which is the point of shipping it as a static
      # page rather than as a service.
      - name: Build the PPTX playground
        run: bash gallery/pptx/web/standalone/build.sh --out "$GITHUB_WORKSPACE/_site/pptx"

      # A page whose engine failed to copy looks exactly like a page whose
      # engine failed to compile, and both look fine until someone opens
      # them. The build script checks its own output; this checks that what
      # the artifact will actually carry is there.
      - name: Check the PPTX playground has an engine
        run: |
          test -s "$GITHUB_WORKSPACE/_site/pptx/pptx_web.js"
          test -s "$GITHUB_WORKSPACE/_site/pptx/standalone.mjs"
          test -s "$GITHUB_WORKSPACE/_site/pptx/gl/evg-webgl.js"
          test -s "$GITHUB_WORKSPACE/_site/pptx/deck.pptx"
          # The .odp the page's own button fetches. A missing file here is a
          # button that does nothing, and the page looks fine until it is
          # pressed — which is the failure mode this whole step exists for.
          test -s "$GITHUB_WORKSPACE/_site/pptx/sample.odp"
          grep -q "PptxWeb" "$GITHUB_WORKSPACE/_site/pptx/pptx_web.js"

      # ---- Fig reader at /figma/ ------------------------------------------
      # Upload a .fig / .deck in the tab. ZIP + kiwi + EVG, no server.
      - name: Build the Fig reader
        run: bash gallery/figma/web/standalone/build.sh --out "$GITHUB_WORKSPACE/_site/figma"

      - name: Check the Fig reader has an engine
        run: |
          test -s "$GITHUB_WORKSPACE/_site/figma/fig_web.js"
          test -s "$GITHUB_WORKSPACE/_site/figma/standalone.mjs"
          test -s "$GITHUB_WORKSPACE/_site/figma/gl/evg-webgl.js"
          # The page opens this by itself, so a missing fixture is a blank
          # viewer on the first paint rather than a 404 anyone would notice.
          test -s "$GITHUB_WORKSPACE/_site/figma/fixtures/health.fig"
          grep -q "FigWeb" "$GITHUB_WORKSPACE/_site/figma/fig_web.js"
          # zstd is decoded in Ranger now (gallery/zstd), so the page ships
          # no vendored decoder and installs no host hook. A vendor/
          # directory reappearing here means someone put one back.
          test ! -e "$GITHUB_WORKSPACE/_site/figma/vendor"
          ! grep -q "installZstd" "$GITHUB_WORKSPACE/_site/figma/standalone.mjs"

      # The steps above only prove the files are there. This one runs the
      # engine: health.fig end to end, and the clipboard path — a paste is
      # the one input nobody can test by opening the deployed page, since
      # it needs Figma at the other end of the clipboard. The build above
      # left dist/ in place, which is what the smoke test loads.
      - name: Check the Fig reader parses and pastes
        run: node gallery/figma/web/standalone/smoke.mjs

      # ---- The markdown viewer at /markdown/ -------------------------------
      # A CommonMark parser in Ranger, its own line breaker, and the same WebGL
      # painter every other page here uses. The build script compiles the
      # facade and checks the bundle defines its class with `require` undefined
      # — which is what a browser looks like, and which is also the only proof
      # that the PDF writer on this page never reaches for a file.
      - name: Build the markdown viewer
        run: bash gallery/markdown/web/standalone/build.sh --out "$GITHUB_WORKSPACE/_site/markdown"

      - name: Check the markdown page has an engine
        run: |
          test -s "$GITHUB_WORKSPACE/_site/markdown/index.html"
          test -s "$GITHUB_WORKSPACE/_site/markdown/markdown_web.js"
          test -s "$GITHUB_WORKSPACE/_site/markdown/standalone.mjs"
          test -s "$GITHUB_WORKSPACE/_site/markdown/gl/evg-webgl.js"
          # The page fetches these itself on load, so a missing one is a blank
          # canvas rather than a 404 anyone would notice.
          test -s "$GITHUB_WORKSPACE/_site/markdown/fonts/OpenSans-Regular.ttf"
          test -s "$GITHUB_WORKSPACE/_site/markdown/fonts/OpenSans-Bold.ttf"
          test -s "$GITHUB_WORKSPACE/_site/markdown/samples/mermaid.md"
          grep -q "MarkdownWeb" "$GITHUB_WORKSPACE/_site/markdown/markdown_web.js"
          # Without the Mermaid reader in the bundle every fence on the sample
          # renders as a code block, which no screenshot would flag.
          grep -q "MermaidRender" "$GITHUB_WORKSPACE/_site/markdown/markdown_web.js"

      # ---- RangerFlow at /rangerflow/ --------------------------------------
      # The graph editor with no host process: the schema is parsed in the tab,
      # the Mermaid box is read by the same reader the tests drive, and the
      # scene is drawn by the shared WebGL painter. The build script compiles
      # the facade and checks that the bundle defines its class with `require`
      # undefined — which is what a browser looks like.
      - name: Build the RangerFlow editor
        run: bash gallery/rangerflow/web/standalone/build.sh --out "$GITHUB_WORKSPACE/_site/rangerflow"

      - name: Check the RangerFlow page has an engine
        run: |
          test -s "$GITHUB_WORKSPACE/_site/rangerflow/index.html"
          test -s "$GITHUB_WORKSPACE/_site/rangerflow/rangerflow_web.js"
          test -s "$GITHUB_WORKSPACE/_site/rangerflow/standalone.mjs"
          test -s "$GITHUB_WORKSPACE/_site/rangerflow/gl/evg-webgl.js"
          # The page fetches this by itself on load, so a missing fixture is an
          # empty canvas rather than a 404 anyone would notice.
          test -s "$GITHUB_WORKSPACE/_site/rangerflow/ecommerce.sql"
          test -s "$GITHUB_WORKSPACE/_site/rangerflow/fonts/NotoSans-Regular.ttf"
          grep -q "RangerFlowWeb" "$GITHUB_WORKSPACE/_site/rangerflow/rangerflow_web.js"
          # The Mermaid box is part of the page rather than a separate demo;
          # without the reader in the bundle the dropdown has an entry that
          # renders nothing.
          grep -q "MermaidReader" "$GITHUB_WORKSPACE/_site/rangerflow/rangerflow_web.js"

      # Does the engine agree with ITSELF? The frame is published twice — as
      # JSON, where every field arrives with its name, and as packed
      # Int32Arrays, which are positional and can be misread in silence. This
      # needs no toolchain and takes a second, so it runs here rather than
      # after the Emscripten install below: a decoder that has the record's
      # shape wrong fails the parity step at the end of this job with a
      # RangeError a hundred fields downstream of the cause, which is exactly
      # how the 24-to-26 stride change was found, the hard way.
      - name: Check the frame survives being packed
        run: node gallery/pptx/web/host/scene-binary-check.mjs

      # ---- The same editor, as WebAssembly, at /pptx-wasm/ ----------------
      # Ranger -> C++ -> Emscripten -> WASM. This is the only route that
      # carries a program this size today: the direct LLVM/WAT backend is
      # freestanding (primitives, no strings or objects), and the Rust backend
      # gets through the Ranger frontend but emits Rust that does not yet
      # compile — see RUST_ISSUES.md for the taxonomy.
      #
      # emsdk is installed rather than pulled from a third-party action, and
      # cached on the SDK version so a site deploy does not re-download 300 MB
      # of toolchain every time.
      - name: Cache the Emscripten SDK
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Install the Emscripten SDK
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Build the WebAssembly editor
        run: |
          # shellcheck disable=SC1091
          source ~/emsdk/emsdk_env.sh
          bash gallery/pptx/web/wasm/build.sh --out "$GITHUB_WORKSPACE/_site/pptx-wasm"

      # Does the WebAssembly engine draw the same picture as the JavaScript
      # one? Every fixture, every slide, command by command and field by
      # field. This is the check that caught `-fno-exceptions` turning a
      # `catch (...)` in the Ranger runtime into an abort on one deck — a
      # fault no amount of looking at the page would have found, because the
      # page it broke was not the one anybody opens.
      - name: Check the two engines agree
        run: |
          # shellcheck disable=SC1091
          source ~/emsdk/emsdk_env.sh
          # The chart deck the comparison is really about is built from the
          # playground's preset through the published JavaScript API, and that
          # package is generated rather than checked in. Nothing earlier in
          # this job builds it.
          bash gallery/pptx/api/js/build.sh
          node gallery/pptx/web/wasm/parity.mjs

      # And that what the artifact will actually carry is there. A page whose
      # engine failed to copy looks exactly like one whose engine failed to
      # compile, and both look fine until someone opens them.
      - name: Check the WebAssembly page has an engine
        run: |
          test -s "$GITHUB_WORKSPACE/_site/pptx-wasm/pptx_wasm.wasm"
          test -s "$GITHUB_WORKSPACE/_site/pptx-wasm/pptx_wasm.mjs"
          test -s "$GITHUB_WORKSPACE/_site/pptx-wasm/wasm-host.mjs"
          test -s "$GITHUB_WORKSPACE/_site/pptx-wasm/standalone.mjs"
          test -s "$GITHUB_WORKSPACE/_site/pptx-wasm/gl/evg-webgl.js"
          test -s "$GITHUB_WORKSPACE/_site/pptx-wasm/deck.pptx"
          # The page must NOT have picked up the JavaScript engine as well —
          # that would publish a page that looks like it runs on WebAssembly
          # and does not.
          test ! -e "$GITHUB_WORKSPACE/_site/pptx-wasm/pptx_web.js"
          grep -q "installPptxWeb" "$GITHUB_WORKSPACE/_site/pptx-wasm/index.html"

      # ---- Playground at the site root -----------------------------------
      - name: Install playground dependencies
        working-directory: playground
        run: npm ci

      - name: Build playground
        working-directory: playground
        run: npm run build

      - name: Assemble site root
        run: |
          # Copy the playground build to the site root, preserving _site/games.
          cp -r playground/dist/. "$GITHUB_WORKSPACE/_site/"
          # The docs build emits /docs/_astro/. A Jekyll pass would drop every
          # underscore-prefixed directory, so mark the artifact as not-Jekyll.
          touch "$GITHUB_WORKSPACE/_site/.nojekyll"
          echo "Site contents:"
          find "$GITHUB_WORKSPACE/_site" -maxdepth 2 -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
