# Deploy the public site to GitHub Pages:
#   /         -> the language's front page (landing/): what Ranger is, what it
#                compiles to, which platforms it reaches, and the gallery. Its
#                backdrop is an EVG display list drawn on the GPU by the same
#                WebGL painter the editors below use, and the mark on it is
#                the project's logo vectorised by lib/evg's bitmap tracer.
#   /playground/ -> the Ranger playground (compile Ranger in the browser). It
#                was the site root until the front page took that spot; the
#                build that produces it is unchanged apart from its base path.
#   /games/   -> the Ranger game engine compiled to JavaScript, running games
#                in the browser via a virtual filesystem (Pong today; the WASM
#                car game + a GPU 3D demo are the next entries).
#   /games/v2/ -> v2 interpreter live demos (staged ComponentEngine +
#                RgRegistryBridge / RgGameHost — ylos2 2D + live 3D guests).
#   /evg/     -> the EVG showcase: the layout engine's own example pages, each
#                rendered under two themes and to PDF, PNG and HTML from one
#                source tree and one stylesheet. Live pages in the same tree:
#                /evg/tracer/ (bitmap → paths), /evg/responsive/,
#                /evg/chart-api/.
#   (/pptx/, /pptx-wasm/ and /office/ — the deck editor, its WebAssembly build
#    and the .pptx API playground with its reference — were built from
#    gallery/pptx, which moved to the private terotests/RangerPPTX. They are
#    no longer built here.)
#   /vela/    -> paste a Vega or Vega-Lite specification and see what the
#                Ranger runtime draws. The compiler and the SVG renderer it
#                loads are built from gallery/vela/src, so the page shows this
#                commit's own output rather than a recorded one.
#   /realtrainer/ -> the RealTrainer port: a phone app drawn by EVG's WebGL
#                painter, measured screen by screen against the original. The
#                page is the window — one tree, and the stylesheet's @media
#                blocks fold the rail or the bottom bar at 768px — so it is
#                the phone app on a phone and the desktop app on a desktop.
#                The app runs in a Worker and its frames are painted on the
#                main thread (evg-engine.js); ?engine=main keeps it on the
#                main thread, and ?painter=dom — which paints the same app as
#                DOM nodes kept across frames (lib/evg/html/evg-dom.js on
#                EVGHostTree) — requires that. The document carries a picture
#                of the app's chrome, computed in the build from its own
#                display list (web/snapshot.mjs), so nothing is blank while
#                the bundle is on its way.
#                /evg/responsive/?painter=dom is the same painter on the
#                responsive page.
#   /figma/   -> the Figma .fig / .deck reader: it opens on a real Figma
#                export (fixtures/health.fig) and takes any other file you
#                upload or paste in the tab, parsing it (ZIP → kiwi → node
#                tree) and drawing it with EVG. ?file=sample opens the deck
#                Ranger builds in memory instead.
#   /rave/    -> the editor after Rafi: Routes / Components / Layers, one
#                page at three widths from one tree, Design | Run over the
#                same document. Chrome and app are both EVG on one canvas.
#   /rafi/    -> the same reader with its chrome in Ranger rather than in
#                HTML: the rails, the layers tree, the panel, the toolbar and
#                the status strip are EVG elements on the same canvas as the
#                board. /figma/ stays as the reference the two are compared
#                against.
#                Timed against OpenFig on the same bytes when that library
#                is present; the sample deck is built from Ranger.
#   /ui/      -> redirects only. The EVG controller gallery (/ui/demo/ and
#                /ui/web/) moved to https://github.com/terotests/EVGUI and is
#                published at https://terotests.github.io/EVGUI/; /ui/,
#                /ui/demo/ and /ui/web/ forward there with ?demo= and #hash
#                kept, so links shared before the move still open.
#   /docs/    -> the language documentation. The operator reference is generated
#                from compiler/Lang.rgr and lib/*.rgr by docs/tools, and the
#                examples on it are compiled by the compiler built in this job,
#                so the docs cannot drift from the release they ship with.
#
# This is the single Pages deployer for the repo (it supersedes the old
# deploy-playground.yml). GitHub Pages allows one deployment per repository, so
# both surfaces are assembled into one artifact here to avoid clobbering.
#
# REQUIRED repo setting (Settings → Pages → Build and deployment → Source):
#   GitHub Actions
# If Source is still "Deploy from a branch" (master /), GitHub also runs the
# automatic pages-build-deployment / jekyll-build-pages job on every push. That
# legacy Jekyll pass reads docs/site/**/*.astro `---` blocks as YAML and fails
# (Invalid YAML front matter). Do not "fix" that by adding a root .nojekyll or
# a Jekyll _config.yml that makes the branch builder succeed — it would publish
# the raw master tree and clobber this workflow's artifact. Switch Source to
# GitHub Actions so only this workflow deploys.
#
# Runs automatically on pushes to master that touch the site, and can be run
# independently at any time from the Actions tab (workflow_dispatch).
name: Deploy site (front page + playground + games) to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "landing/**"
      - "playground/**"
      - "gallery/game_engine/web/**"
      - "gallery/game_engine/v2/**"
      - "gallery/game_engine/tests/pong_runner_demo.rgr"
      - "gallery/game_engine/scripting/**"
      - "compiler/**"
      - "lib/**"
      - "docs/**"
      - "lib/evg/**"
      - "gallery/vela/**"
      # The RealTrainer page at /realtrainer/ is built from these, and from
      # the controls in gallery/ui it is drawn with.
      - "gallery/realtrainer/**"
      # The firesim console at /firesim/ is built from these.
      - "gallery/firesim/**"
      # The M-Files emulator at /mfiles/.
      - "gallery/mfiles/**"
      # The controllers RealTrainer, Firesim and Rave are drawn with.
      - "gallery/ui/**"
      # Rave takes its undo history from gallery/office.
      - "gallery/office/**"
      - "gallery/pdf_writer/src/**"
      - "gallery/figma/**"
      # The .fig reader decodes zstd in Ranger, so the decoder is part of
      # /figma/ and /rave/ even though neither directory names it.
      - "gallery/zstd/src/**"
      # Rave at /rave/ — the editor, its chrome sheet and its page. It also
      # builds from gallery/figma (the .fig importer), gallery/ui (InputCtl),
      # gallery/office (the undo history) and lib/evg, all listed here
      # already; without this line a merge that touches only Rave left the
      # site showing the editor as it was.
      - "gallery/rave/**"
      - "gallery/datagrid/src/script/**"
      - "gallery/text_editor/src/**"
      - "gallery/zip/**"
      - ".github/workflows/deploy-pages.yml"
  # A published release republishes the site, so the documentation on
  # /docs/ always describes the released compiler.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Build Ranger compiler
        run: npm run compile

      # ---- Games site: engine -> JS + packaged game zips + Monaco editor -
      - name: Install games-site dependencies (Monaco + esbuild)
        working-directory: gallery/game_engine/web
        run: npm ci

      - name: Build games site
        run: node gallery/game_engine/web/build.mjs --out "$GITHUB_WORKSPACE/_site/games"

      # ---- 3D model viewer demo (glTF -> SoftRenderer3D, host-side) -------
      - name: Build 3D model demo
        run: node gallery/game_engine/web/build-model3d.mjs --out "$GITHUB_WORKSPACE/_site/games/model3d"

      # ---- Three.js cube on the GPU (.tsx interpreter -> Ranger Three -> WebGL)
      - name: Build tsx3d WebGL demo
        run: node gallery/game_engine/web/build-tsx3d.mjs --out "$GITHUB_WORKSPACE/_site/games/tsx3d"

      # ---- v2 interpreter live demos + Monaco editor (ComponentEngine migrate/src)
      - name: Install v2 games-site dependencies (Monaco + esbuild)
        working-directory: gallery/game_engine/v2/web
        run: npm ci

      - name: Build v2 interpreter Pages demos
        run: node gallery/game_engine/v2/web/build-pages.mjs --out "$GITHUB_WORKSPACE/_site/games/v2"

      # ---- Documentation site at /docs/ ----------------------------------
      - name: Install documentation dependencies
        working-directory: docs/site
        run: npm ci

      - name: Restore the example compilation cache
        uses: actions/cache@v4
        with:
          path: docs/.cache
          key: docs-examples-${{ hashFiles('compiler/**/*.rgr', 'lib/**/*.rgr', 'docs/examples/**') }}
          restore-keys: |
            docs-examples-

      - name: Generate the operator reference
        run: npm run docs:generate
        env:
          # Source links pin to this commit so line numbers stay correct when
          # Lang.rgr moves on master after the pages are generated.
          RANGER_COMMIT: ${{ github.sha }}

      - name: Build the documentation site
        working-directory: docs/site
        run: npm run build
        env:
          RANGER_COMMIT: ${{ github.sha }}
          RANGER_RELEASE: ${{ github.event_name == 'release' }}

      - name: Copy the documentation into the site
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_site/docs"
          cp -r docs/site/dist/. "$GITHUB_WORKSPACE/_site/docs/"

      # ---- EVG showcase at /evg/ -----------------------------------------
      # Renders the layout engine's own example pages with the tools built
      # from this checkout, so the gallery always shows what the engine in
      # this commit actually does.
      - name: Build the EVG showcase
        run: node lib/evg/showcase/build.mjs --out "$GITHUB_WORKSPACE/_site/evg"

      # ---- RealTrainer at /realtrainer/ -----------------------------------
      # The app compiled to JavaScript and bundled with the painter; the page
      # loads one script. `rt:build` needs the compiler built above, and the
      # bundler comes with the conformance host's dependencies.
      - name: Install conformance-host dependencies (esbuild)
        run: npm run ui:conformance:install
      - name: Build RealTrainer
        run: |
          npm run rt:build --silent
          node gallery/realtrainer/web/build.mjs --out "$GITHUB_WORKSPACE/_site/realtrainer"
          # The page is not one file: the entries import chunks with hashed
          # names, the reference data is a file fetched beside them, and the
          # chart compiler is a chunk asked for only after the first frame. So
          # the check is the build's own manifest against the directory —
          # every script shipped, something still deferred, the app really in
          # the bytes.
          node gallery/realtrainer/web/verify-out.mjs "$GITHUB_WORKSPACE/_site/realtrainer"
          test -s "$GITHUB_WORKSPACE/_site/evg/responsive/evg-dom.js"

      # ---- /ui/ -> terotests.github.io/EVGUI ---------------------------------
      # The demos and the playground are built and published by the EVGUI
      # repository. These pages keep the old URLs working.
      - name: Redirect /ui/ to the EVGUI site
        run: |
          for sub in "" demo/ web/; do
            mkdir -p "$GITHUB_WORKSPACE/_site/ui/$sub"
            url="https://terotests.github.io/EVGUI/$sub"
            cat > "$GITHUB_WORKSPACE/_site/ui/${sub}index.html" <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <title>Moved: EVGUI</title>
          <link rel="canonical" href="$url">
          <meta http-equiv="refresh" content="0; url=$url">
          <script>location.replace("$url" + location.search + location.hash);</script>
          <p>The UI gallery moved to <a href="$url">$url</a>.</p>
          HTML
          done
          grep -q 'terotests.github.io/EVGUI/demo/' "$GITHUB_WORKSPACE/_site/ui/demo/index.html"

      # ---- the firesim workbench at /firesim/ ------------------------------
      # A database browser over the Firebase simulator. No bundler: the
      # compiled module is one self-contained file, so the page is a wrapper
      # and a copy of EVG's own browser helpers — which is the same claim the
      # simulator makes about itself, and why this step has no install.
      - name: Build the firesim workbench
        run: |
          npm run firesim:demo:build --silent
          node gallery/firesim/demo/build.mjs --out "$GITHUB_WORKSPACE/_site/firesim"
          test -s "$GITHUB_WORKSPACE/_site/firesim/index.html"
          test -s "$GITHUB_WORKSPACE/_site/firesim/generated-host.js"
          test -s "$GITHUB_WORKSPACE/_site/firesim/evg/gl/evg-webgl.js"
          grep -q "FiresimConsole" "$GITHUB_WORKSPACE/_site/firesim/generated-host.js"
          grep -q "FsRulesEval" "$GITHUB_WORKSPACE/_site/firesim/generated-host.js"
          test -s "$GITHUB_WORKSPACE/_site/firesim/datasets/realtrainer.json"
          test -s "$GITHUB_WORKSPACE/_site/firesim/datasets/realtrainer.rules"

      # ---- the M-Files emulator at /mfiles/ ---------------------------------
      # A vault, its gRPC API and the UIX v1/v2 extension frameworks, with each
      # extension running in Ranger's ComponentEngine. Same no-bundler shape as
      # the firesim page.
      - name: Build the M-Files emulator
        run: |
          npm run mfiles:web:build --silent
          node gallery/mfiles/web/build.mjs --out "$GITHUB_WORKSPACE/_site/mfiles"
          test -s "$GITHUB_WORKSPACE/_site/mfiles/index.html"
          test -s "$GITHUB_WORKSPACE/_site/mfiles/evg/gl/evg-textinput.js"
          grep -q "MfilesApp" "$GITHUB_WORKSPACE/_site/mfiles/generated-host.js"
          grep -q "OnNewShellUI" "$GITHUB_WORKSPACE/_site/mfiles/generated.js"

      # ---- Vela playground at /vela/ --------------------------------------
      # Paste a Vega or Vega-Lite specification and see what the Ranger
      # runtime draws. The script it loads is compiled from the same sources
      # the C++ build uses, so the page shows this commit's own renderer.
      # The chart API at /vela/api/ is built by each ecosystem's OWN tool --
      # documentation.js, pdoc, Dokka and dartdoc -- over the packages `-apipackage`
      # writes. That is the test PLAN_API_DOCS.md 7.3 sets: the target's own
      # tool reads Ranger's output with no Ranger plugin. So the toolchains are
      # installed here rather than the pages being rendered by us.
      #
      # Dokka resolves the Kotlin compiler and its own plugin from mavenCentral
      # through gradle, which is already on the runner. pdoc and documentation.js
      # are one install each.
      - name: Install the documentation toolchains
        run: |
          npm install --no-save --no-audit --no-fund documentation
          python3 -m pip install --quiet --disable-pip-version-check pdoc

      # Dart for dartdoc; gradle for Dokka is already on the runner.
      #
      # .NET and DocFX are NOT installed: C# is out of the API pipeline for
      # now. DocFX ran here, exited 0 and wrote _site/api/*.html with no
      # _site/index.html, so --require failed the whole deploy over a page
      # nobody could see. See the note in build-api-docs.mjs.
      - uses: dart-lang/setup-dart@v1

      - name: Build the Vela page
        run: bash gallery/vela/web/build.sh --out "$GITHUB_WORKSPACE/_site/vela"

      # --require fails the build when a toolchain is missing. Without it a
      # runner that lost one would publish a smaller site and say nothing --
      # the same silent-skip failure the formatter's own gate exists to avoid.
      - name: Check every API toolchain ran
        run: |
          node gallery/vela/web/build-api-docs.mjs \
            --out "$GITHUB_WORKSPACE/_site/vela/api" --require
          test -s "$GITHUB_WORKSPACE/_site/vela/api/index.html"
          test -s "$GITHUB_WORKSPACE/_site/vela/api/javascript/index.html"
          test -s "$GITHUB_WORKSPACE/_site/vela/api/python/vela_chart.html"
          test -s "$GITHUB_WORKSPACE/_site/vela/api/kotlin/index.html"
          test -s "$GITHUB_WORKSPACE/_site/vela/api/dart/index.html"

      # ---- Fig reader at /figma/ ------------------------------------------
      # Upload a .fig / .deck in the tab. ZIP + kiwi + EVG, no server.
      - name: Build the Fig reader
        run: bash gallery/figma/web/standalone/build.sh --out "$GITHUB_WORKSPACE/_site/figma"

      - name: Check the Fig reader has an engine
        run: |
          test -s "$GITHUB_WORKSPACE/_site/figma/fig_web.js"
          test -s "$GITHUB_WORKSPACE/_site/figma/standalone.mjs"
          test -s "$GITHUB_WORKSPACE/_site/figma/gl/evg-webgl.js"
          # The page opens this by itself, so a missing fixture is a blank
          # viewer on the first paint rather than a 404 anyone would notice.
          test -s "$GITHUB_WORKSPACE/_site/figma/fixtures/health.fig"
          grep -q "FigWeb" "$GITHUB_WORKSPACE/_site/figma/fig_web.js"
          # zstd is decoded in Ranger now (gallery/zstd), so the page ships
          # no vendored decoder and installs no host hook. A vendor/
          # directory reappearing here means someone put one back.
          test ! -e "$GITHUB_WORKSPACE/_site/figma/vendor"
          ! grep -q "installZstd" "$GITHUB_WORKSPACE/_site/figma/standalone.mjs"

      # The steps above only prove the files are there. This one runs the
      # engine: health.fig end to end, and the clipboard path — a paste is
      # the one input nobody can test by opening the deployed page, since
      # it needs Figma at the other end of the clipboard. The build above
      # left dist/ in place, which is what the smoke test loads.
      - name: Check the Fig reader parses and pastes
        run: node gallery/figma/web/standalone/smoke.mjs

      # ---- The same editor, in Ranger, at /rafi/ ---------------------------
      # The reader above with its chrome taken out of the DOM: the rails, the
      # tree, the panel, the toolbar and the strip are EVG elements drawn on
      # the same canvas as the board. The page beside it is kept as the
      # reference — two editors over one reader is the point of having both.
      - name: Build Rafi
        run: npm run rafi:build --silent && node gallery/figma/web/rafi/build.mjs --out "$GITHUB_WORKSPACE/_site/rafi"

      - name: Check Rafi has an engine
        run: |
          test -s "$GITHUB_WORKSPACE/_site/rafi/generated-host.js"
          test -s "$GITHUB_WORKSPACE/_site/rafi/main.js"
          test -s "$GITHUB_WORKSPACE/_site/rafi/evg/gl/evg-webgl.js"
          # The page opens this by itself, so a missing fixture is a blank
          # editor on the first paint rather than a 404 anyone would notice.
          test -s "$GITHUB_WORKSPACE/_site/rafi/fixtures/health.fig"
          grep -q "RafiApp" "$GITHUB_WORKSPACE/_site/rafi/generated-host.js"

      # The files being there proves nothing about the editor. This runs it:
      # the whole chrome is Ranger, so the rails, the panes, the tree and the
      # board all answer in Node without a browser.
      - name: Check Rafi draws its editor
        run: node gallery/figma/web/rafi/smoke.mjs

      # ---- Rave, at /rave/ ---------------------------------------------------
      # The editor after Rafi: the same chrome, but what is on the stage is an
      # application — routes, layouts, pages, a stylesheet with breakpoints —
      # laid out at three widths from one tree and run in place. Chrome and
      # app are both Ranger, so the page is checked in Node before it ships.
      - name: Build Rave
        run: npm run rave:build --silent && node gallery/rave/web/build.mjs --out "$GITHUB_WORKSPACE/_site/rave"

      - name: Check Rave has an engine
        run: |
          test -s "$GITHUB_WORKSPACE/_site/rave/generated-host.js"
          test -s "$GITHUB_WORKSPACE/_site/rave/main.js"
          test -s "$GITHUB_WORKSPACE/_site/rave/evg/gl/evg-webgl.js"
          grep -q "RaveEditor" "$GITHUB_WORKSPACE/_site/rave/generated-host.js"

      - name: Check Rave draws its editor
        run: node gallery/rave/web/smoke.mjs

      # ---- Playground at /playground/ -------------------------------------
      - name: Install playground dependencies
        working-directory: playground
        run: npm ci

      - name: Build playground
        working-directory: playground
        run: npm run build

      - name: Copy the playground into the site
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_site/playground"
          cp -r playground/dist/. "$GITHUB_WORKSPACE/_site/playground/"

      # ---- The front page at the site root --------------------------------
      # It has no dependencies of its own: plain HTML, one stylesheet and one
      # module. What the build does do is recompile landing/examples/Cart.rgr
      # for every target the page shows, with the compiler built in this job,
      # so the "one source, many targets" section cannot quote an older
      # release than the one being published.
      - name: Build the front page
        run: node landing/build.mjs --out "$GITHUB_WORKSPACE/_site"

      # A front page whose backdrop, letter or example did not make it into the
      # artifact still renders — and is not the page. Fail here instead.
      - name: Check the front page is whole
        run: |
          test -s "$GITHUB_WORKSPACE/_site/index.html"
          test -s "$GITHUB_WORKSPACE/_site/styles.css"
          test -s "$GITHUB_WORKSPACE/_site/main.js"
          test -s "$GITHUB_WORKSPACE/_site/assets/ranger-mark.svg"
          test -s "$GITHUB_WORKSPACE/_site/assets/hero/hero.json"
          test -s "$GITHUB_WORKSPACE/_site/assets/gl/evg-webgl.js"
          test -s "$GITHUB_WORKSPACE/_site/assets/targets.js"
          test -s "$GITHUB_WORKSPACE/_site/playground/index.html"
          # The targets file is generated, so assert it carries what the page
          # reads rather than merely existing.
          grep -q "RANGER_TARGETS" "$GITHUB_WORKSPACE/_site/assets/targets.js"
          grep -q '"swift"' "$GITHUB_WORKSPACE/_site/assets/targets.js"

      - name: Assemble site root
        run: |
          # The docs build emits /docs/_astro/. A Jekyll pass would drop every
          # underscore-prefixed directory, so mark the artifact as not-Jekyll.
          touch "$GITHUB_WORKSPACE/_site/.nojekyll"
          echo "Site contents:"
          find "$GITHUB_WORKSPACE/_site" -maxdepth 2 -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
