# Run tests on pull requests and pushes to main
# Note: This workflow only runs ES6 tests. For full language testing (Go, Python, Rust),
# see ci.yml which sets up the required language runtimes.
name: Tests

on:
  push:
    branches: [main, master, "topic/**"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install dependencies
        run: npm ci

      - name: Run ES6 tests
        run: npm run test:es6

  # Stable required check name for branch protection.
  # Prefer this over matrix-specific job names like test (20.x).
  test-gate:
    name: test-gate
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "ES6 test matrix failed or was cancelled"
            exit 1
          fi
          echo "All ES6 tests passed!"
