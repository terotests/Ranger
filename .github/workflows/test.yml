# Run tests on pull requests and pushes to main
# Note: This workflow only runs ES6 tests. For full language testing (Go, Python, Rust),
# see ci.yml which sets up the required language runtimes.
name: Tests

on:
  push:
    branches: [main, master, "topic/**"]
  pull_request:
    branches: [main, master]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      gallery_only: ${{ steps.gallery_only.outputs.result }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set gallery-only flag
        id: gallery_only
        run: |
          # dorny paths-filter '**' + '!gallery/**' is OR-matched, so '**' makes
          # non_gallery always true and gallery-only PRs incorrectly run full CI.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" 2>/dev/null || true
            files=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          else
            files=$(git diff --name-only HEAD~1...HEAD 2>/dev/null || true)
          fi
          echo "Changed files:"
          echo "$files"
          if [ -z "$files" ]; then
            echo "result=false" >> "$GITHUB_OUTPUT"
            echo "Empty diff — running full ES6 matrix"
            exit 0
          fi
          if echo "$files" | grep -v '^$' | grep -vq '^gallery/'; then
            echo "result=false" >> "$GITHUB_OUTPUT"
            echo "Non-gallery changes detected — running full ES6 matrix"
            echo "$files" | grep -v '^$' | grep -v '^gallery/' || true
          else
            echo "result=true" >> "$GITHUB_OUTPUT"
            echo "Gallery-only change detected — skipping full ES6 matrix"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.gallery_only != 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install dependencies
        run: npm ci

      - name: Run ES6 tests
        run: npm run test:es6

  gallery-smoke:
    name: gallery-smoke
    needs: changes
    if: needs.changes.outputs.gallery_only == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install dependencies
        run: npm ci

      - name: Run gallery smoke test
        run: npm run engine:pong:runner

  # Stable required check name for branch protection.
  # Prefer this over matrix-specific job names like test (20.x).
  test-gate:
    name: test-gate
    runs-on: ubuntu-latest
    needs: [changes, test, gallery-smoke]
    if: always()
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.changes.outputs.gallery_only }}" = "true" ]; then
            if [ "${{ needs.gallery-smoke.result }}" != "success" ]; then
              echo "Gallery smoke test failed or was cancelled"
              exit 1
            fi
            echo "Gallery-only change: smoke test passed (full checks skipped)"
            exit 0
          fi

          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "ES6 test matrix failed or was cancelled"
            exit 1
          fi
          echo "All ES6 tests passed!"
