# Build native `rangerc` binaries through the C++ target and attach them to a
# release. The compiler compiles itself to one C++ translation unit, so a
# release binary is the same self-hosting path CI already gates
# (tests/compiler-selfhost.test.ts) taken one step further: link it, prove it
# reproduces the Node build's JavaScript, and ship it.
name: Release binaries

on:
  release:
    types: [published]
  # A release workflow nobody runs between releases is a workflow that is broken
  # at the next release. Changing the build script or this file re-runs the
  # Linux build on the pull request.
  pull_request:
    paths:
      - "scripts/build-native-compiler.sh"
      - ".github/workflows/release-binaries.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload to (empty: build artifacts only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      # A pull request builds one platform — enough to know the script still
      # works; a release builds all three. (`matrix` is not available to a
      # job-level `if`, so the selection has to happen here.)
      #
      #   linux-x64      built on the oldest supported image, so the binary's
      #                  glibc floor is as low as the runners allow
      #   linux-arm64    arm64 Linux runners are free for public repositories;
      #                  where they are not available this one job fails to
      #                  start and the others still publish (fail-fast is off)
      #   macos-universal one universal2 binary instead of two downloads —
      #                  clang cross-compiles x86_64 on the arm64 runner
      matrix:
        include: >-
          ${{ github.event_name == 'pull_request'
          && fromJSON('[{"os":"ubuntu-22.04","platform":"linux-x64","extra":""}]')
          || fromJSON('[{"os":"ubuntu-22.04","platform":"linux-x64","extra":""},{"os":"ubuntu-22.04-arm","platform":"linux-arm64","extra":""},{"os":"macos-14","platform":"macos-universal","extra":"--arch arm64 --arch x86_64"}]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install dependencies
        run: npm ci

      # The archive is named from package.json, not from the tag, so a mismatch
      # would ship ranger-3.3.1-*.tar.gz on a v3.4.0 release. Warn, do not block.
      - name: Check version against tag
        if: github.event_name == 'release'
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::warning::release tag $TAG does not match package.json version $VERSION"
          fi

      # --bootstrap makes the built binary compile the compiler and compares the
      # JavaScript with what the Node build writes from the same sources. A
      # binary that passes that has exercised most of the language on itself.
      - name: Build native compiler
        run: >
          bash scripts/build-native-compiler.sh
          --platform ${{ matrix.platform }}
          --tarball --bootstrap ${{ matrix.extra }}

      - name: Report binary
        run: |
          BIN="tmp/native/ranger-$(node -p "require('./package.json').version")-${{ matrix.platform }}/rangerc"
          ls -l "$BIN"
          file "$BIN" || true

      # apt install ./ranger-compiler_<version>_<arch>.deb works straight off a
      # release download; a hosted apt repository would sign these same files.
      - name: Build .deb
        if: startsWith(matrix.platform, 'linux')
        run: >
          bash scripts/package-native.sh
          --dir tmp/native/ranger-$(node -p "require('./package.json').version")-${{ matrix.platform }}
          --deb

      - name: Verify the .deb installs and runs
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get install -y ./tmp/native/ranger-compiler_*.deb
          cd "$(mktemp -d)"
          cp "$GITHUB_WORKSPACE/tests/fixtures/hello.rgr" .
          # No RANGER_LIB, no .rgr library anywhere: the library is in the binary.
          env -u RANGER_LIB rangerc -es6 ./hello.rgr -nodecli -d=./out -o=hello.js
          test "$(node out/hello.js)" = "Hello World"
          sudo dpkg -r ranger-compiler

      # The formula needs the published URL, so it is only meaningful for a tag.
      - name: Write Homebrew formula
        if: matrix.platform == 'macos-universal' && (github.event_name == 'release' || inputs.tag != '')
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: >
          bash scripts/package-native.sh
          --dir tmp/native/ranger-$(node -p "require('./package.json').version")-${{ matrix.platform }}
          --formula "$TAG" --repo "${{ github.repository }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ranger-${{ matrix.platform }}
          path: |
            tmp/native/*.tar.gz
            tmp/native/*.tar.gz.sha256
            tmp/native/*.deb
            tmp/native/ranger.rb
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          shopt -s nullglob
          gh release upload "$TAG" \
            tmp/native/*.tar.gz tmp/native/*.tar.gz.sha256 \
            tmp/native/*.deb tmp/native/ranger.rb --clobber
