name: CI

on:
  push:
    branches: [main, master, topic/*]
  pull_request:
    branches: [main, master]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      gallery_only: ${{ steps.gallery_only.outputs.result }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set gallery-only flag
        id: gallery_only
        run: |
          # dorny paths-filter '**' + '!gallery/**' is OR-matched, so '**' makes
          # non_gallery always true and gallery-only PRs incorrectly run full CI.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" 2>/dev/null || true
            files=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          else
            files=$(git diff --name-only HEAD~1...HEAD 2>/dev/null || true)
          fi
          echo "Changed files:"
          echo "$files"
          if [ -z "$files" ]; then
            echo "result=false" >> "$GITHUB_OUTPUT"
            echo "Empty diff — running full checks"
            exit 0
          fi
          if echo "$files" | grep -v '^$' | grep -vq '^gallery/'; then
            echo "result=false" >> "$GITHUB_OUTPUT"
            echo "Non-gallery changes detected — running full compiler checks"
            echo "$files" | grep -v '^$' | grep -v '^gallery/' || true
          else
            echo "result=true" >> "$GITHUB_OUTPUT"
            echo "Gallery-only change detected — skipping full compiler checks"
          fi

  # Required checks must report success even for gallery-only PRs. A skipped
  # job never satisfies branch protection (merge stays BLOCKED).
  test-es6:
    needs: changes
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Gallery-only — required check no-op
        if: needs.changes.outputs.gallery_only == 'true'
        run: echo "Skipping ES6 suite for gallery-only PR"

      - name: Checkout repository
        if: needs.changes.outputs.gallery_only != 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        if: needs.changes.outputs.gallery_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        if: needs.changes.outputs.gallery_only != 'true'
        run: npm ci

      - name: Run ES6 unit tests
        if: needs.changes.outputs.gallery_only != 'true'
        run: npm run test:es6

  test-go:
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Gallery-only — required check no-op
        if: needs.changes.outputs.gallery_only == 'true'
        run: echo "Skipping Go suite for gallery-only PR"

      - name: Checkout repository
        if: needs.changes.outputs.gallery_only != 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: needs.changes.outputs.gallery_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Setup Go
        if: needs.changes.outputs.gallery_only != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install dependencies
        if: needs.changes.outputs.gallery_only != 'true'
        run: npm ci

      - name: Run Go unit tests
        if: needs.changes.outputs.gallery_only != 'true'
        run: npm run test:go

  test-python:
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Gallery-only — required check no-op
        if: needs.changes.outputs.gallery_only == 'true'
        run: echo "Skipping Python suite for gallery-only PR"

      - name: Checkout repository
        if: needs.changes.outputs.gallery_only != 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: needs.changes.outputs.gallery_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Setup Python
        if: needs.changes.outputs.gallery_only != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: needs.changes.outputs.gallery_only != 'true'
        run: npm ci

      - name: Run Python unit tests
        if: needs.changes.outputs.gallery_only != 'true'
        run: npm run test:python

  test-dart:
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Gallery-only — required check no-op
        if: needs.changes.outputs.gallery_only == 'true'
        run: echo "Skipping Dart suite for gallery-only PR"

      - name: Checkout repository
        if: needs.changes.outputs.gallery_only != 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: needs.changes.outputs.gallery_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Setup Dart
        if: needs.changes.outputs.gallery_only != 'true'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        if: needs.changes.outputs.gallery_only != 'true'
        run: npm ci

      - name: Run Dart unit tests
        if: needs.changes.outputs.gallery_only != 'true'
        run: npm run test:dart

      # Split by target so each Vitest invocation stays under birpc's ~60s
      # RPC timeout (avoids false `Timeout calling "onTaskUpdate"` failures).
      - name: Run Dart conformance
        if: needs.changes.outputs.gallery_only != 'true'
        run: |
          cfg=tests/vitest.dartconformance.config.ts
          npx vitest run --config "$cfg" -t "should have at least one conformance fixture"
          npx vitest run --config "$cfg" -t "ES6 reference target"
          npx vitest run --config "$cfg" -t "Go target"
          npx vitest run --config "$cfg" -t "Kotlin target"
          npx vitest run --config "$cfg" -t "Dart target"

  gallery-smoke:
    name: gallery-smoke
    needs: changes
    if: needs.changes.outputs.gallery_only == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run gallery smoke test
        run: npm run engine:pong:runner

  # The interpreter realm is gallery code but its tests live in tests/, so this
  # job is deliberately ungated: a change on either side must re-check that the
  # evaluator still produces the values Node produces. A parser score alone says
  # nothing about whether a feature actually runs.
  runtime-conformance:
    name: runtime-conformance
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build the interpreter module
        run: ./scripts/build-engine-module.sh

      - name: Run runtime conformance tests
        run: npm run test:runtime

  # The engine's own contract suite: 106 suites, ~1900 assertions covering the
  # interpreter, bridge, registry and renderer. Nothing ran it in CI, yet it is
  # what caught the one real regression during this branch's engine work — the
  # vitest jobs do not exercise these paths at all. Ungated for the same reason
  # as runtime-conformance: the code is under gallery/ but a change on either
  # side of that boundary can break it.
  #
  # TEMPORARILY DISABLED: this job dominates wall-clock CI (~5 min vs ~1 min
  # for the other jobs). Re-enable by removing `if: false` and restoring the
  # test-gate check below. Still runnable locally via `npm run engine:v2:test`.
  engine-contract:
    name: engine-contract
    needs: changes
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run the v2 engine contract suite
        run: npm run engine:v2:test

  # Stable required check name for branch protection.
  # Prefer this over matrix-specific job names like test-es6 (20.x).
  test-gate:
    name: test-gate
    runs-on: ubuntu-latest
    needs: [changes, test-es6, test-go, test-python, test-dart, gallery-smoke, runtime-conformance, engine-contract]
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.runtime-conformance.result }}" != "success" ]; then
            echo "Runtime conformance tests failed or were cancelled"
            exit 1
          fi
          # engine-contract is temporarily disabled (if: false → skipped).
          # When re-enabling, require success again:
          # if [ "${{ needs.engine-contract.result }}" != "success" ]; then
          #   echo "Engine contract suite failed or were cancelled"
          #   exit 1
          # fi

          if [ "${{ needs.changes.outputs.gallery_only }}" = "true" ]; then
            if [ "${{ needs.gallery-smoke.result }}" != "success" ]; then
              echo "Gallery smoke test failed or was cancelled"
              exit 1
            fi
            if [ "${{ needs.test-es6.result }}" != "success" ]; then
              echo "ES6 no-op job failed"
              exit 1
            fi
            if [ "${{ needs.test-go.result }}" != "success" ]; then
              echo "Go no-op job failed"
              exit 1
            fi
            if [ "${{ needs.test-python.result }}" != "success" ]; then
              echo "Python no-op job failed"
              exit 1
            fi
            if [ "${{ needs.test-dart.result }}" != "success" ]; then
              echo "Dart no-op job failed"
              exit 1
            fi
            echo "Gallery-only change: smoke + required no-ops + runtime conformance passed"
            exit 0
          fi

          if [ "${{ needs.test-es6.result }}" != "success" ]; then
            echo "ES6 tests failed or were cancelled"
            exit 1
          fi
          if [ "${{ needs.test-go.result }}" != "success" ]; then
            echo "Go tests failed or were cancelled"
            exit 1
          fi
          if [ "${{ needs.test-python.result }}" != "success" ]; then
            echo "Python tests failed or were cancelled"
            exit 1
          fi
          if [ "${{ needs.test-dart.result }}" != "success" ]; then
            echo "Dart tests failed or were cancelled"
            exit 1
          fi
          echo "All tests passed!"
