# Vale configuration for the Ranger documentation.
#
# The rules below are the mechanical part of ASD-STE100 Simplified Technical
# English: sentence length, active voice, no gerund at the head of a sentence,
# one term for one thing, and no promotional wording.
#
# The complete approved-word check needs the ASD-STE100 dictionary, which this
# repository must not redistribute. That part of the standard is a review step:
# see docs/site/src/content/docs/contributing/writing-rules.md.

StylesPath = styles
MinAlertLevel = warning

[*.{md,mdx}]
BasedOnStyles = RangerSTE

# The generated reference pages are build output. The text in them comes from
# the operator descriptions, which are linted at their source.
