<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranger · EVG live build</title>
<style>
  @font-face {
    font-family: "Noto Sans";
    src: url("/fonts/NotoSans-Regular.ttf") format("truetype");
    font-weight: 400;
  }
  @font-face {
    font-family: "Noto Sans";
    src: url("/fonts/NotoSans-Bold.ttf") format("truetype");
    font-weight: 700;
  }
  :root {
    --bg: #070b14;
    --panel: #101826;
    --ink: #e8eef7;
    --muted: #8b9bb4;
    --line: rgba(255,255,255,.08);
    --accent: #5eead4;
    --warn: #fbbf24;
    --phone: #020617;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.45 ui-sans-serif, system-ui, "Noto Sans", sans-serif; }
  body {
    display: grid;
    grid-template-rows: auto 1fr;
    min-height: 100%;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #121a28, #0c1320);
  }
  .mark {
    font-weight: 700; letter-spacing: .04em; font-size: 13px;
    color: var(--accent);
  }
  .mark span { color: var(--ink); font-weight: 600; letter-spacing: 0; }
  .ask {
    flex: 1; min-width: 240px; display: flex; gap: 8px;
  }
  .ask input {
    flex: 1; background: #0b1220; color: var(--ink); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; font: inherit; outline: none;
  }
  .ask input:focus { border-color: #2dd4bf55; }
  button, .chip {
    background: #152033; color: var(--ink); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 14px; font: inherit; cursor: pointer;
  }
  button.primary { background: #134e4a; border-color: #2dd4bf66; color: #ccfbf1; font-weight: 650; }
  button:disabled { opacity: .5; cursor: wait; }
  .chips, .agents { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip.active { border-color: #2dd4bf88; color: var(--accent); }
  .chip.off { opacity: .45; cursor: not-allowed; }
  /* Run mode: the phone is an app, not a drawing, and the cursor says so. */
  .chip.live { border-color: #2dd4bf88; background: #134e4a; color: #ccfbf1; }
  .screen.live { cursor: pointer; }
  .lbl { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  select.chip { appearance: none; max-width: 190px; }
  /* A picture attached to the ask: what it traced to, and the colours it is
     made of, so the palette is visible to the person too. */
  .attach { display: flex; align-items: center; gap: 8px; }
  .shot {
    display: none; align-items: center; gap: 8px; padding: 4px 10px 4px 4px;
    border: 1px solid var(--line); border-radius: 999px; background: #0b1220;
    font-size: 11.5px; color: var(--muted);
  }
  .shot.on { display: flex; }
  .shot img { width: 30px; height: 30px; object-fit: cover; border-radius: 8px; }
  .swatches { display: flex; gap: 3px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(255,255,255,.14); }
  .shot button {
    border: 0; background: none; color: var(--muted); padding: 0 2px;
    font-size: 14px; line-height: 1; cursor: pointer;
  }
  /* THE PICTURE GETS THE ROOM.
     The stage used to be capped at 420px with the debug panes taking `1fr`,
     which was backwards: the screen being designed is the thing being looked
     at, and it is the thing that has to grow to a desktop viewport. Now the
     stage is flexible and the panes are a narrow fixed column that can be
     folded away entirely. */
  main {
    display: grid;
    grid-template-columns: 1fr minmax(260px, 340px);
    gap: 0;
    min-height: 0;
  }
  main.solo { grid-template-columns: 1fr 0; }
  main.solo .side { display: none; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }
  .stage {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 28px 16px 40px; border-right: 1px solid var(--line);
    background:
      radial-gradient(600px 280px at 50% 0%, rgba(45,212,191,.08), transparent 70%),
      var(--bg);
    overflow: auto;
  }
  /* The device is two numbers and a bezel. `--vw`/`--vh` are the viewport the
     document is laid out at; `--fit` is how much of it fits on this monitor.
     A 1440-wide desktop page has to be shrunk to be looked at, and shrinking
     the picture is honest in a way that cropping it is not. */
  .fit {
    width: calc((var(--vw) + 24px) * var(--fit));
    height: calc((var(--vh) + 24px) * var(--fit));
  }
  .devices {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    margin-bottom: 14px; width: 100%; justify-content: center;
  }
  .devices .chip { padding: 3px 10px; font-size: 11.5px; }
  .devices .chip.on { border-color: var(--accent); color: var(--accent); }
  .devices #fold { margin-left: auto; }
  .devices .lbl { font-variant-numeric: tabular-nums; }
  .phone {
    width: var(--vw); height: var(--vh); background: var(--phone);
    border-radius: 36px; padding: 12px; box-shadow:
      0 0 0 1px rgba(255,255,255,.08),
      0 30px 80px rgba(0,0,0,.55);
    position: relative;
    transform: scale(var(--fit)); transform-origin: top left;
  }
  .phone .notch {
    position: absolute; top: 18px; left: 50%; width: 110px; height: 18px;
    margin-left: -55px; background: #020617; border-radius: 20px; z-index: 2;
  }
  /* A tablet has a thinner bezel and no notch; a desktop is a window, so it
     gets square corners and no rounding on the picture inside. */
  .phone.tablet { border-radius: 22px; padding: 14px; }
  .phone.desktop { border-radius: 10px; padding: 10px; }
  .phone.tablet .notch, .phone.desktop .notch { display: none; }
  .phone.tablet .screen { border-radius: 12px; }
  .phone.desktop .screen { border-radius: 4px; }
  .screen {
    width: var(--vw); height: var(--vh); border-radius: 28px; overflow: hidden;
    background: #0b1220;
    position: relative;
  }
  .screen svg { display: block; }
  /* The picked element, outlined over the picture rather than beside it.
     `pointer-events: none` so the outline never eats the next click. */
  .pickbox {
    position: absolute; pointer-events: none;
    outline: 1px solid var(--accent, #7dd3a0);
    background: rgba(125, 211, 160, 0.12);
  }
  /* The chain, page first. Each level is a button because choosing the level
     IS the picker — the node under a pointer is rarely the one meant. */
  .chain { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .chain button {
    font: inherit; font-size: 11px; cursor: pointer;
    border: 1px solid #2b3648; background: #131c2b; color: var(--muted, #8b9bb4);
    border-radius: 999px; padding: 2px 8px;
  }
  .chain button.on { border-color: var(--accent, #7dd3a0); color: var(--accent, #7dd3a0); }
  .meta {
    margin-top: 16px; color: var(--muted); font-size: 12px; display: flex; gap: 14px;
    font-variant-numeric: tabular-nums;
  }
  .meta b { color: var(--accent); font-weight: 650; }
  .meta b.bad { color: var(--warn); }
  /* The layout numbers, next to the picture they are about. A model cannot
     see the screen; this is the part of it that can be read. */
  .findings {
    margin-top: 8px; max-width: 414px; text-align: center;
    color: var(--muted); font-size: 11.5px; line-height: 1.5;
  }
  .findings .bad { color: var(--warn); }
  /* The machine's context: the debug line that says what a press moved. */
  .findings .ctx { color: var(--ink2, #7dd3a0); }
  .side {
    display: grid; grid-template-rows: 1.1fr 1fr 1.1fr; min-height: 0;
  }
  section {
    min-height: 0; display: flex; flex-direction: column;
    border-bottom: 1px solid var(--line);
  }
  section h2 {
    margin: 0; padding: 10px 16px; font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--muted); font-weight: 650;
    border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
  }
  .think, .ops, .code {
    flex: 1; overflow: auto; padding: 12px 16px; margin: 0;
    font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-word;
  }
  .think { color: #d1fae5; background: #07140f; }
  .think .cursor {
    display: inline-block; width: 7px; height: 13px; background: var(--accent);
    margin-left: 2px; vertical-align: -1px; animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  /* A build can think for a long time between two tokens. Without this the
     page looks finished the whole time it is working. */
  .spin {
    display: none; width: 10px; height: 10px; margin-left: 8px;
    border: 2px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  .spin.on { display: inline-block; }
  h2 .lead { display: flex; align-items: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ops { color: #e2e8f0; background: #0c1220; }
  .op {
    display: inline-block; margin: 0 6px 6px 0; padding: 3px 8px;
    border-radius: 6px; background: #1e293b; color: #cbd5e1; font-size: 11px;
  }
  .op.insert { color: #99f6e4; }
  .op.set-text { color: #fde68a; }
  .op.set-prop { color: #bfdbfe; }
  .code { color: #c4b5fd; background: #0b1020; }
  .empty { color: var(--muted); }
</style>
<header>
  <div class="mark">RANGER · <span>EVG live build</span></div>
  <form class="ask" id="ask">
    <input id="prompt" name="prompt" autocomplete="off"
      placeholder="Change this phone, then Follow up. Start-over chips wipe it.">
    <button class="primary" id="go" type="submit">Follow up</button>
  </form>
  <div class="attach">
    <input type="file" id="pick" accept="image/png,image/jpeg" hidden>
    <button type="button" class="chip" id="attach" title="Attach a picture — it is traced to vector and its colours read">Picture</button>
    <span class="shot" id="shot">
      <img id="thumb" alt="">
      <span class="swatches" id="swatches"></span>
      <span id="shotText"></span>
      <button type="button" id="drop" title="Remove">×</button>
    </span>
  </div>
  <div class="chips" id="chips"></div>
  <button type="button" class="chip" id="run" title="Run the app: the machine owns the page, a press is an event">Run</button>
  <button type="button" class="chip" id="makeapp" hidden title="Write app/machine.json and a page per state from this phone">Make this an app</button>
  <span class="lbl">Keep</span>
  <button type="button" class="chip" id="save" title="Save this phone — the document and its app — so it survives the next start over">Save</button>
  <select id="saved" class="chip" title="Open a saved design back into this session">
    <option value="">Saved…</option>
  </select>
  <div class="agents" id="agents"></div>
</header>
<main>
  <div class="stage">
    <!-- WHAT SIZE OF SCREEN. A design is not a phone; it is a document that
         has to survive a phone, a tablet and a desktop, and the only way to
         know is to look at it at those sizes. The viewport is a view: it goes
         to the layout, never to the file. -->
    <div class="devices">
      <button type="button" class="chip on" data-dev="phone">Phone</button>
      <button type="button" class="chip" data-dev="tablet">Tablet</button>
      <button type="button" class="chip" data-dev="desktop">Desktop</button>
      <button type="button" class="chip" id="turn" title="Turn it on its side">⟲ Landscape</button>
      <span class="lbl" id="vpLabel">390 × 844</span>
      <button type="button" class="chip" id="fold" title="Fold the panes away and give the screen the room">Panes ›</button>
    </div>
    <div class="fit">
      <div class="phone" id="phone">
        <div class="notch"></div>
        <div class="screen" id="screen"></div>
      </div>
    </div>
    <div class="meta">
      <span>draw <b id="ncmds">0</b></span>
      <span>delta <b id="added">0</b></span>
      <span>nodes <b id="nodes">0</b></span>
      <span>tokens <b id="ntok">0</b></span>
      <span>layout <b id="lay">—</b></span>
      <!-- What the run cost. `tokens` above counts the words streamed onto
           this page; this is what the agent's CLI reports it actually spent,
           which is the number anybody asks after watching a screen get
           built. Empty until a run ends. -->
      <span id="spendBox" hidden>spend <b id="spend">—</b></span>
    </div>
    <div class="findings" id="findings"></div>
  </div>
  <div class="side">
    <section>
      <h2><span class="lead">Thinking <span class="spin" id="spin"></span></span> <span id="kindLabel"></span></h2>
      <pre class="think" id="think"><span class="empty">Loading a phone seed…</span></pre>
    </section>
    <section>
      <h2>EVGPatch ops</h2>
      <div class="ops" id="ops"><span class="empty">Deltas land here as they apply.</span></div>
    </section>
    <section>
      <h2>Ranger · App.rgr</h2>
      <pre class="code" id="code"><span class="empty">Source is streamed with the tree.</span></pre>
    </section>
  </div>
</main>
<script type="module">
import { renderDisplayList } from "/evg-html.js";

const $ = (id) => document.getElementById(id);
const kinds = await (await fetch("/kinds")).json();
const agentList = await (await fetch("/agents")).json();
const chips = $("chips");
const agentBox = $("agents");
let current = "dashboard";
const params = new URLSearchParams(location.search);
const preferred = params.get("agent") || agentList.preferred || "recipe";
const preferredInfo = (agentList.agents || []).find((a) => a.id === preferred);
let currentAgent = preferredInfo && preferredInfo.available ? preferred : "recipe";
let es = null;
let tokens = 0;
let thinkStarted = false;
let pendingBreak = false;
let atParagraphStart = true;

const al = document.createElement("span");
al.className = "lbl";
al.textContent = "Agent";
agentBox.appendChild(al);
for (const a of agentList.agents) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "chip" + (a.id === currentAgent ? " active" : "") + (a.available ? "" : " off");
  b.textContent = a.label;
  b.title = a.where + " — " + a.hint;
  b.disabled = !a.available;
  b.addEventListener("click", () => {
    if (!a.available) return;
    currentAgent = a.id;
    agentBox.querySelectorAll(".chip").forEach((c) => c.classList.toggle("active", c === b));
  });
  agentBox.appendChild(b);
}

const sl = document.createElement("span");
sl.className = "lbl";
sl.textContent = "Start over";
sl.title = "These chips replace the live phone. Follow up does not.";
chips.appendChild(sl);
for (const k of kinds.kinds) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "chip" + (k.id === current ? " active" : "");
  b.textContent = k.label;
  b.addEventListener("click", () => {
    current = k.id;
    $("prompt").value = k.prompt;
    chips.querySelectorAll(".chip").forEach((c) => c.classList.toggle("active", c === b));
    loadSeed(k.id);
  });
  chips.appendChild(b);
}
$("prompt").value = kinds.kinds[0].prompt;

$("ask").addEventListener("submit", (e) => {
  e.preventDefault();
  start(true);
});

// SAVING, AND GETTING IT BACK.
//
// The session is a temp directory, so everything made here was being thrown
// away by the next start-over. A save copies the session's own files — the
// document, and the app if the screen became one — under `saved/<name>/`, and
// opening one copies them back. Nothing is derived on the way out, so nothing
// can be lost on the way in: what you open is the screen you saved, still
// editable, app and all.
function paintSaved(list) {
  const sel = $("saved");
  const keep = sel.value;
  sel.replaceChildren();
  const head = document.createElement("option");
  head.value = "";
  head.textContent = list.length ? `Saved (${list.length})…` : "Saved…";
  sel.append(head);
  for (const d of list) {
    const o = document.createElement("option");
    o.value = d.slug;
    o.textContent = d.pages ? `${d.name} · ${d.pages} pages` : d.name;
    o.title = d.prompt || "";
    sel.append(o);
  }
  sel.value = keep && list.some((d) => d.slug === keep) ? keep : "";
}

async function refreshSaved() {
  try {
    paintSaved((await (await fetch("/saved")).json()).saved || []);
  } catch {
    /* the list is a convenience; the page works without it */
  }
}

$("save").addEventListener("click", async () => {
  const name = prompt("Save this phone as:", current || "screen");
  if (name === null) return;
  $("save").disabled = true;
  try {
    const d = await runFetch("/save", { name });
    paintSaved(d.saved || []);
    $("saved").value = d.slug;
    note(`saved as “${d.name}”${d.pages ? ` with ${d.pages} pages` : ""} — reopen it from Saved`);
  } catch (e) {
    note("save failed: " + (e.message || e));
  } finally {
    $("save").disabled = false;
  }
});

$("saved").addEventListener("change", async (ev) => {
  const slug = ev.target.value;
  if (!slug) return;
  if (runMode) leaveRun();
  try {
    const d = await runFetch("/open", { slug });
    current = d.kind || current;
    paintFrame(d);
    paintMeasure(d.measure);
    $("added").textContent = "seed";
    $("kindLabel").textContent = d.name || current;
    $("findings").replaceChildren();
    note(d.prompt ? `opened “${d.name}” — asked for: ${d.prompt}` : `opened “${d.name}”`);
  } catch (e) {
    note("open failed: " + (e.message || e));
  }
});

// One line under the phone, where everything else about the screen is said.
function note(text) {
  const el = document.createElement("div");
  el.textContent = text;
  $("findings").replaceChildren(el);
}

async function loadSeed(kind) {
  if (es) { es.close(); es = null; }
  $("go").disabled = false;
  const d = await (await fetch("/seed?kind=" + encodeURIComponent(kind))).json();
  current = d.kind || kind;
  paintFrame(d);
  paintMeasure(d.measure);
  $("added").textContent = "seed";
  $("kindLabel").textContent = current;
  $("think").innerHTML = '<span class="empty">This phone is the live document. Type a change and press Follow up — it edits this screen. Start-over chips (Dashboard / Empty) wipe it.</span>';
  $("ops").innerHTML = '<span class="empty">Deltas land here as they apply.</span>';
  $("code").innerHTML = '<span class="empty">Source is streamed with the tree.</span>';
  $("ntok").textContent = "0";
  tokens = 0;
  thinkStarted = false;
  pendingBreak = false;
  atParagraphStart = true;
  spin(false);
}

// `measure` is the layout answering for itself: what overlaps and by how much,
// what left the page, how close two things are, how much room is left. It is
// streamed after every frame and was going nowhere until now.
function paintMeasure(m) {
  if (!m) {
    $("lay").textContent = "—";
    $("lay").className = "";
    $("findings").textContent = "";
    return;
  }
  // `count` is defects; a screen where nothing lines up has none of those and
  // is still wrong, so the badge counts both.
  const n = (m.count || 0) + (m.align || []).length;
  $("lay").textContent = n ? String(n) : "ok";
  $("lay").className = n ? "bad" : "";
  const room = Number.isFinite(m.bottomFree) ? `${m.bottomFree}px free below the content` : "";
  const bad = [...(m.findings || []), ...(m.align || [])].slice(0, 3);
  const near = (m.tight || []).slice(0, 2);
  $("findings").replaceChildren();
  for (const text of bad) {
    const el = document.createElement("div");
    el.className = "bad";
    el.textContent = text;
    $("findings").appendChild(el);
  }
  const rest = [...near, room].filter(Boolean).join(" · ");
  if (rest) {
    const el = document.createElement("div");
    el.textContent = rest;
    $("findings").appendChild(el);
  }
}

// A SURFACE EFFECT IS A SHADER.
//
// `evg-surface-effect: starfield` on an element reaches the display list as an
// instance with its box and parameters, and the SVG painter reports it as
// unsupported — correctly, because there is no DOM equivalent of a starfield.
// So a frame that carries effects is painted by the GPU painter the gallery's
// demo page uses, on a canvas, with the effect driver aging its events and
// stamping the clock on each instance every frame. A frame without effects
// keeps the SVG: it is cheaper, its text is selectable, and it is what every
// screen here was until one of them asked for a shader.
let gl = null;
let glCanvas = null;
let fxDriver = null;
let fxLast = 0;
let fxRaf = 0;
let fxDoc = null;

function stopGl() {
  if (fxRaf) cancelAnimationFrame(fxRaf);
  fxRaf = 0;
  fxLast = 0;
  fxDoc = null;
}

async function paintGl(d) {
  if (!fxDriver) {
    const [{ renderDisplayList: paintGpu }, fx] = await Promise.all([
      import("/evg-webgl.js"),
      import("/evg-fx.js"),
    ]);
    window.__paintGpu = paintGpu;
    fxDriver = fx.createEffectDriver();
    window.__fxAttach = fx.attachEffectPointer;
  }
  const paintGpu = window.__paintGpu;
  if (!glCanvas || glCanvas.parentNode !== $("screen")) {
    glCanvas = document.createElement("canvas");
    glCanvas.style.display = "block";
    $("screen").replaceChildren(glCanvas);
    gl = glCanvas.getContext("webgl2", { antialias: true, premultipliedAlpha: false, stencil: true });
    if (!gl) throw new Error("WebGL 2 is not available in this browser");
    // Press and drag reach the effects the same way they reach the app: a
    // point. `always` effects need none of this and cost nothing for it.
    window.__fxAttach(glCanvas, fxDriver, () => {});
  }
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  glCanvas.style.width = d.width + "px";
  glCanvas.style.height = d.height + "px";
  glCanvas.width = Math.round(d.width * dpr);
  glCanvas.height = Math.round(d.height * dpr);
  fxDoc = { width: d.width, height: d.height, list: d.list };
  if (fxRaf) return;
  const frame = (now) => {
    fxRaf = requestAnimationFrame(frame);
    if (!fxDoc) return;
    const dt = fxLast ? Math.min(now - fxLast, 100) : 16;
    fxLast = now;
    fxDriver.tick(dt, fxDoc.list);
    window.__glStats = paintGpu(gl, fxDoc, { dpr: Math.min(2, window.devicePixelRatio || 1) });
  };
  fxRaf = requestAnimationFrame(frame);
}

function paintFrame(d) {
  $("ncmds").textContent = String(d.ncmds || 0);
  $("nodes").textContent = String(d.nodes || 0);
  // The page size the picker has to hit test against, and a selection that is
  // now about a document that has changed under it.
  lastWidth = d.width || lastWidth;
  lastHeight = d.height || lastHeight;
  // The box follows the picture. A frame that came back at a size nobody
  // asked for — Run mode's app page, a document read at its own width — is
  // still shown whole rather than cropped by a stale bezel.
  sizeStage(lastWidth, lastHeight);
  lastChain = [];
  clearPick();
  if (!d.list) return;
  const effects = d.list.effects || [];
  window.__painter = effects.length ? "webgl" : "svg";
  if (effects.length) {
    paintGl(d).catch((e) => {
      window.__painter = "svg";
      stopGl();
      glCanvas = null;
      renderDisplayList($("screen"), { width: d.width, height: d.height, list: d.list }, {});
      note(`${effects.map((f) => f.kind).join(", ")}: ${e.message || e} — painted without the effect`);
    });
    return;
  }
  stopGl();
  if (glCanvas) {
    glCanvas.remove();
    glCanvas = null;
    gl = null;
  }
  renderDisplayList($("screen"), { width: d.width, height: d.height, list: d.list }, {});
}

function start(keepPicture) {
  if (es) { es.close(); es = null; }
  thinkStarted = false;
  pendingBreak = false;
  atParagraphStart = true;
  tokens = 0;
  spin(true);
  $("think").textContent = "";
  $("ops").innerHTML = "";
  $("code").textContent = "";
  $("ncmds").textContent = keepPicture ? $("ncmds").textContent : "0";
  $("added").textContent = "0";
  $("nodes").textContent = keepPicture ? $("nodes").textContent : "0";
  $("ntok").textContent = "0";
  $("kindLabel").textContent = "";
  paintMeasure(null);
  $("go").disabled = true;
  if (!keepPicture) $("screen").replaceChildren();
  const prompt = $("prompt").value.trim() || current;
  es = new EventSource(`/stream?agent=${encodeURIComponent(currentAgent)}&kind=${encodeURIComponent(current)}&prompt=${encodeURIComponent(prompt)}&pace=24`);
  const on = (type, fn) => es.addEventListener(type, (ev) => {
    if (!ev.data) return;
    fn(JSON.parse(ev.data));
  });
  on("session", (d) => {
    $("kindLabel").textContent = (d.agent ? d.agent + " · " : "") + (d.followUp ? "follow-up" : d.kind);
    if (!d.followUp && d.kind) {
      current = d.kind;
      chips.querySelectorAll(".chip").forEach((c, i) => {
        c.classList.toggle("active", kinds.kinds[i] && kinds.kinds[i].id === d.kind);
      });
    }
  });
  // A `think` is a thought boundary, and it arrives BEFORE the thought from
  // the recipe and AFTER it from a streaming CLI. Taking the break at the next
  // token instead of at once is what makes both orders read the same, and what
  // keeps a paragraph from opening with a blank line or closing with one.
  on("think", () => {
    if (thinkStarted) pendingBreak = true;
  });
  on("token", (d) => {
    if (!thinkStarted) {
      $("think").textContent = "";
      thinkStarted = true;
    }
    if (pendingBreak) {
      $("think").append("\n\n");
      pendingBreak = false;
      atParagraphStart = true;
    }
    $("think").append((tokens && !atParagraphStart ? " " : "") + d.text);
    atParagraphStart = false;
    $("think").append(cursor());
    tokens += 1;
    $("ntok").textContent = String(tokens);
    $("think").scrollTop = $("think").scrollHeight;
  });
  // WHAT THE RUN COST, from the agent's own CLI rather than from counting
  // what arrived here. Input is dominated by cache reads in any agent loop —
  // the conversation is re-read on every tool call — so the read total is
  // shown whole and broken out on hover, where the shape is visible.
  on("usage", (d) => {
    const k = (n) => (n >= 1000 ? `${(n / 1000).toFixed(n >= 10000 ? 0 : 1)}k` : String(n));
    const bits = [`${k(d.readTotal || 0)} in`, `${k(d.output || 0)} out`];
    if (typeof d.costUsd === "number") bits.push(`$${d.costUsd.toFixed(4)}`);
    $("spend").textContent = bits.join(" · ");
    $("spendBox").hidden = false;
    $("spendBox").title = [
      `uncached input ${(d.input || 0).toLocaleString()}`,
      `cache read     ${(d.cacheRead || 0).toLocaleString()}`,
      `cache write    ${(d.cacheWrite || 0).toLocaleString()}`,
      `output         ${(d.output || 0).toLocaleString()}`,
      d.turns ? `turns          ${d.turns}` : "",
      d.models ? `model          ${d.models.join(", ")}` : "",
    ].filter(Boolean).join("\n");
  });
  on("ops", (d) => {
    for (const op of d.ops || []) {
      const el = document.createElement("span");
      el.className = "op " + op.op;
      el.textContent = op.op === "insert"
        ? `${op.op} ${op.tag} @ ${op.at}`
        : op.op === "set-text"
          ? `${op.op} @ ${op.at}`
          : `${op.op} ${op.prop || ""} @ ${op.at}`;
      $("ops").appendChild(el);
    }
    $("ops").scrollTop = $("ops").scrollHeight;
  });
  on("code", (d) => {
    $("code").textContent = d.text || "";
    $("code").scrollTop = $("code").scrollHeight;
  });
  on("frame", (d) => {
    $("added").textContent = "+" + String(d.added || 0);
    paintFrame(d);
  });
  on("measure", paintMeasure);
  on("error", (d) => {
    $("think").append("\n\nerror: " + (d.text || "failed"));
    pendingBreak = true;
  });
  on("done", (d) => {
    $("go").disabled = false;
    spin(false);
    $("added").textContent = d.ok ? "done" : "failed";
    const cur = $("think").querySelector(".cursor");
    if (cur) cur.remove();
    if (es) es.close();
  });
  es.onerror = () => {
    $("go").disabled = false;
    spin(false);
    if (es && es.readyState === EventSource.CONNECTING) {
      // The stream ended. Do not let the browser open a second build.
      es.close();
    }
  };
}

// --- THE ATTACHED PICTURE -----------------------------------------------------
//
// The file never reaches the model. The host traces it with Ranger's bitmap
// tracer and the agent is handed flat colour layers and a counted palette,
// which is the part it can act on; this row is so the person can see what was
// read out of their picture.
function showShot(a, dataUrl) {
  const on = Boolean(a && a.colors && a.colors.length);
  $("shot").classList.toggle("on", on);
  if (!on) {
    $("thumb").removeAttribute("src");
    $("swatches").replaceChildren();
    $("shotText").textContent = "";
    return;
  }
  if (dataUrl) $("thumb").src = dataUrl;
  $("swatches").replaceChildren();
  for (const c of a.colors.slice(0, 6)) {
    const sw = document.createElement("span");
    sw.className = "swatch";
    sw.style.background = c.hex;
    sw.title = `${c.hex} · ${Math.round((c.share || 0) * 100)}%`;
    $("swatches").appendChild(sw);
  }
  $("shotText").textContent = `${a.width}×${a.height}, ${a.layers} layers`;
}

async function sendShot(file) {
  const dataUrl = await new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result || ""));
    r.onerror = () => reject(new Error("could not read that file"));
    r.readAsDataURL(file);
  });
  $("attach").textContent = "Tracing…";
  $("attach").disabled = true;
  try {
    const res = await fetch("/attach", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ dataUrl, width: 358 }),
    });
    const a = await res.json();
    if (a.error) throw new Error(a.error);
    showShot(a, dataUrl);
  } catch (e) {
    $("shot").classList.remove("on");
    $("think").append("\n\nattach: " + (e.message || e));
  } finally {
    $("attach").textContent = "Picture";
    $("attach").disabled = false;
  }
}

$("attach").addEventListener("click", () => $("pick").click());
$("pick").addEventListener("change", () => {
  const file = $("pick").files && $("pick").files[0];
  if (file) sendShot(file);
  $("pick").value = "";
});
$("drop").addEventListener("click", async () => {
  await fetch("/attach", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ clear: true }),
  });
  showShot(null);
});
// A screenshot in the clipboard is the usual way one of these arrives.
window.addEventListener("paste", (ev) => {
  for (const item of (ev.clipboardData && ev.clipboardData.items) || []) {
    if (item.type && item.type.startsWith("image/")) {
      const file = item.getAsFile();
      if (file) {
        ev.preventDefault();
        sendShot(file);
      }
      return;
    }
  }
});

// --- RUN MODE -----------------------------------------------------------------
//
// Design mode streams a display list per frame, which is what drawing a screen
// looks like. Run mode is the app: `/app` is the page for the state the
// machine is in, a click is a point the host turns into an event, and what
// comes back is the page for wherever that left it. The painter is the same
// one; what changes is who decides what it paints.
let runMode = false;
// The context as the last frame had it, so a press can say what it moved.
let lastContext = null;

async function runFetch(url, body) {
  const res = await fetch(url, body
    ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }
    : undefined);
  const d = await res.json();
  if (d.error) throw new Error(d.error);
  return d;
}

function paintApp(d) {
  paintFrame(d);
  paintMeasure(d.layout ? { ...d.layout, findings: d.layout.findings || [] } : null);
  $("kindLabel").textContent = `app · ${d.state}${d.code ? " · code" : d.local ? " · in the tab" : ""}`;
  $("added").textContent = d.took === false && d.pressed ? "no event" : "app";
  const lines = [];
  // The example app is not this session's phone, and saying so is the whole
  // difference between "Run does nothing" and "Run is running something else".
  if (d.example) {
    lines.push(["bad", "this is the example app — the phone you designed is a document, not an app yet"]);
    $("makeapp").hidden = false;
  } else {
    $("makeapp").hidden = true;
  }
  // A press that lands on an identical page looks like nothing happened. Say
  // which states share a document, so the next ask to the agent is the right
  // one — make the screens differ, not "the button is broken".
  if ((d.copies || []).length) {
    const pairs = d.copies.map(([a, b]) => `${a} = ${b}`).join(", ");
    lines.push(["bad", `${pairs}: the same document, so a press moves the machine and the screen does not change`]);
  }
  if (d.pressed && d.took === false) {
    lines.push(["bad", `#${d.pressed || "nothing"} is not an event of ${d.state}`]);
  }
  // THE CONTEXT, and what the last press moved in it. A press the machine
  // takes and that changes nothing on the screen looks exactly like a press
  // that went nowhere — both are a dead button from the outside. These two
  // lines are the difference: the keys as they are, and the ones that just
  // changed. A switch whose key moved and whose screen did not is a control
  // that was never bound (`./evg-ui add … --bind <key>`); a press that moved
  // no key at all is a transition the machine does not have.
  if (d.context) {
    const now = d.context;
    const moved = Object.keys(now).filter((k) => lastContext && JSON.stringify(lastContext[k]) !== JSON.stringify(now[k]));
    const shown = Object.entries(now).map(([k, v]) => `${k}=${typeof v === "string" ? v : JSON.stringify(v)}`);
    if (shown.length) lines.push(["ctx", "context  " + shown.join("  ·  ")]);
    if (d.pressed && d.took) {
      if (moved.length) {
        lines.push(["", `${d.pressed} moved ${moved.map((k) => `${k}: ${lastContext[k]} → ${now[k]}`).join(", ")}`]);
      } else {
        lines.push(["bad", `${d.pressed} was taken and changed no key — the transition assigns nothing`]);
      }
    }
    lastContext = now;
  }
  lines.push(["", (d.events || []).slice(-4).join(" → ") || "no presses yet"]);
  $("findings").replaceChildren(...lines.map(([cls, text]) => {
    const el = document.createElement("div");
    if (cls) el.className = cls;
    el.textContent = text;
    return el;
  }));
}

// A designed screen becomes an app: the machine and a page per state, written
// from the phone that is on the page. Which parts of each screen differ is a
// design decision, so every page starts as the same screen and `check` says
// what is missing.
async function makeApp() {
  $("makeapp").disabled = true;
  $("makeapp").textContent = "Writing…";
  try {
    const made = await runFetch("/app/init", { states: "" });
    const missing = (made.missing || []).join(", ");
    $("think").textContent = [
      `app/machine.json written: ${(made.states || []).join(", ")}`,
      `${made.pages} page${made.pages === 1 ? "" : "s"}, ${made.idsOnTheScreen} pressable id${made.idsOnTheScreen === 1 ? "" : "s"} on the screen`,
      missing ? `missing: ${missing}` : "",
      made.next || "",
      "",
      "Ask the agent to give the tabs those ids and make each page its own — then press Run again.",
    ].filter(Boolean).join("\n\n");
    await enterRun();
  } catch (e) {
    $("think").append("\n\napp: " + (e.message || e));
  } finally {
    $("makeapp").disabled = false;
    $("makeapp").textContent = "Make this an app";
  }
}

$("makeapp").addEventListener("click", makeApp);

// THE APP RUNS HERE, NOT ON THE SERVER.
//
// A data app is a machine and one document per state — data, all of it. The
// host sends it once and the runtime compiled from EvgAppWeb.rgr does the
// rest in this tab: hit test the laid-out page, send the id, build the page
// for wherever the machine landed. A press is a function call, about 2ms,
// and it needs no process, no tool and no shell on anybody's machine — which
// is the point, because the agent that designed the screen may be on the
// other side of a network with none of those.
//
// A code app is a compiled program the server imports and holds open, so it
// stays on the server. `webApp` being null is how this page knows which it is
// looking at, and nothing else changes.
let webApp = null;
let webData = null;
let webEvents = [];

// The bundle is a classic script and declares `class EvgAppWeb`, which makes a
// global LEXICAL binding — not a property of `window`. Looking for it on
// `window` finds nothing and falls back to the server, quietly, forever.
const runtimeCtor = () => (typeof EvgAppWeb === "undefined" ? null : EvgAppWeb);

async function loadWebRuntime(data) {
  if (!runtimeCtor()) {
    await new Promise((ok, no) => {
      const s = document.createElement("script");
      s.src = "/app/web.js";
      s.onload = ok;
      s.onerror = () => no(new Error("the browser runtime did not load"));
      document.head.append(s);
    });
  }
  const Ctor = runtimeCtor();
  if (!Ctor) throw new Error("the browser runtime did not define EvgAppWeb");
  const w = new Ctor();
  if (!w.boot(data.machine)) throw new Error("the machine did not load");
  for (const [state, doc] of Object.entries(data.pages || {})) w.put(state, doc);
  window.webApp = w;
  return w;
}

// One frame, from the runtime in this tab, in the shape paintApp takes.
function webFrame(data, extra = {}) {
  const f = JSON.parse(webApp.frame());
  return { ...f, app: data.app, example: data.example, copies: data.copies, events: webEvents, local: true, ...extra };
}

// The device chips choose the viewport a DOCUMENT is laid out at. An app
// renders at the page size its own machine was built with, so in Run mode the
// chips are off rather than lit-and-ignored.
function devicesEnabled(on) {
  for (const b of document.querySelectorAll(".devices [data-dev], .devices #turn")) {
    b.classList.toggle("off", !on);
    b.disabled = !on;
    b.title = on ? "" : "Run mode renders at the app's own page size";
  }
}

async function enterRun() {
  runMode = true;
  devicesEnabled(false);
  if (es) { es.close(); es = null; }
  $("run").classList.add("live");
  $("screen").classList.add("live");
  $("go").disabled = true;
  $("think").innerHTML = '<span class="empty">Run mode: the machine owns the page. Press the phone — an element\'s id is the event it sends.</span>';
  $("ops").innerHTML = '<span class="empty">Design mode streams ops. Run mode sends events.</span>';
  webApp = null;
  webEvents = [];
  lastContext = null;
  try {
    const data = await runFetch("/app/data");
    if (data.code) {
      paintApp(await runFetch("/app?reset=1"));
      return;
    }
    webData = data;
    webApp = await loadWebRuntime(data);
    paintApp(webFrame(data));
  } catch (e) {
    // The runtime failing is not a reason to have no app: the server can
    // still answer, slower. Falling back quietly would hide a broken build,
    // so it says which one is running.
    try {
      paintApp(await runFetch("/app?reset=1"));
      $("think").append("\n\nthe browser runtime did not start (" + (e.message || e) + ") — running on the server instead");
    } catch (e2) {
      leaveRun();
      $("think").append("\n\napp: " + (e2.message || e2));
    }
  }
}

// Back to design mode. It shows THE DOCUMENT AS IT STANDS — `loadSeed` would
// re-seed the session from a fixture, which is what "start over" means, and
// turning Run off is not that. It was, and it silently threw away every edit
// the agent had made.
async function leaveRun() {
  runMode = false;
  devicesEnabled(true);
  webApp = null;
  webData = null;
  webEvents = [];
  $("makeapp").hidden = true;
  $("run").classList.remove("live");
  $("screen").classList.remove("live");
  $("go").disabled = false;
  try {
    const d = await (await fetch("/doc")).json();
    if (d.error) throw new Error(d.error);
    paintFrame(d);
    paintMeasure(d.measure);
    $("added").textContent = "seed";
    $("kindLabel").textContent = current;
    $("findings").replaceChildren();
  } catch (e) {
    // Only if there is no document to come back to.
    loadSeed(current);
  }
}

$("run").addEventListener("click", () => {
  if (runMode) leaveRun();
  else enterRun();
});

for (const b of document.querySelectorAll(".devices [data-dev]")) {
  b.addEventListener("click", () => {
    device = b.dataset.dev;
    applyViewport();
  });
}
$("turn").addEventListener("click", () => {
  landscape = !landscape;
  applyViewport();
});
// Folding the panes away is not only more room: on a desktop viewport it is
// the difference between seeing the screen and seeing two thirds of it.
$("fold").addEventListener("click", () => {
  const m = document.querySelector("main");
  const solo = m.classList.toggle("solo");
  $("fold").textContent = solo ? "‹ Panes" : "Panes ›";
  applyViewport({ refetch: false });
});
// The stage changing size changes how much of the viewport fits, and nothing
// about the document — so rescale without asking the server again.
addEventListener("resize", () => applyViewport({ refetch: false }));

// The point inside the DOCUMENT, from a point on the monitor.
//
// The screen used to be painted at 390×844 and never scaled, so these were
// the same number. A desktop viewport does not fit on a laptop, so the phone
// is scaled to fit and the two coordinate systems came apart: a click 600px
// across a screen shown at 62% is at 968 in the document. `getBoundingClientRect`
// already reports the SCALED box, so dividing by its own width is exact and
// needs no knowledge of the scale.
function pointIn(ev) {
  const el = $("screen");
  const box = el.getBoundingClientRect();
  const sx = box.width ? el.offsetWidth / box.width : 1;
  const sy = box.height ? el.offsetHeight / box.height : 1;
  return {
    x: Math.round((ev.clientX - box.left) * sx),
    y: Math.round((ev.clientY - box.top) * sy),
  };
}

$("screen").addEventListener("click", async (ev) => {
  // In design mode a click is not a press — it is a QUESTION about the
  // picture. The picture is the only view of the document anybody has here,
  // so "this phone is a document, press Run" was true and useless. Now it
  // picks: the chain from the page down to whatever is under the point, with
  // each level selectable, because the node under a pointer is almost never
  // the one somebody means — a click on a switch lands on its track.
  if (!runMode) {
    const p = pointIn(ev);
    pickAt(p.x, p.y);
    return;
  }
  const { x, y } = pointIn(ev);
  try {
    if (webApp) {
      const hit = JSON.parse(webApp.press(x, y));
      if (hit.id && hit.takes) webEvents = [...webEvents, hit.id];
      paintApp(webFrame(webData, { pressed: hit.id, took: hit.takes, context: hit.context }));
      return;
    }
    paintApp(await runFetch("/app/press", { x, y }));
  } catch (e) {
    $("think").append("\n\napp: " + (e.message || e));
  }
});

// --- THE ELEMENT PICKER -------------------------------------------------------
//
// Design mode's answer to a click. The server lays the document out and hands
// back the chain from the page down to whatever is under the point; this shows
// the levels, outlines the chosen one, and prints its address — which is what
// every `evg-agent` verb takes, so a person can point at a thing on the screen
// and get the `--at=` for it without counting children in an outline.
let lastChain = [];
let lastWidth = 390;
let lastHeight = 844;

// --- THE VIEWPORT -------------------------------------------------------------
//
// Three devices and two orientations. The numbers are the CSS viewports these
// devices actually report, not their panel sizes, because a design is laid out
// against the former.
//
// This is a VIEW. The size is applied to a copy of the document on its way to
// the layout, so looking at a phone screen on a desktop does not rewrite the
// phone screen. `EVGDress` sits in the same place for the same reason.
const DEVICES = {
  phone: { w: 390, h: 844 },
  tablet: { w: 820, h: 1180 },
  desktop: { w: 1440, h: 900 },
};
let device = "phone";
let landscape = false;

function viewport() {
  const d = DEVICES[device] || DEVICES.phone;
  // A desktop is already wide; turning it makes a tall window, which is a
  // real shape and not a mistake.
  return landscape ? { w: d.h, h: d.w } : { w: d.w, h: d.h };
}

// How much of the viewport fits in the stage, as a scale. Never above 1: a
// 390-wide phone on a big monitor stays 390 wide rather than being blown up.
function fitScale(v) {
  const stage = document.querySelector(".stage");
  if (!stage) return 1;
  const availW = stage.clientWidth - 48;
  const availH = stage.clientHeight - 150;
  if (availW <= 0 || availH <= 0) return 1;
  return Math.min(1, availW / (v.w + 24), availH / (v.h + 24));
}

// Size the bezel and the picture to a viewport, and shrink to fit the room.
// Every painter goes through this, so the box on screen always matches the
// picture that was actually painted — Run mode renders at the APP's page size,
// which need not be the device chip that is lit.
function sizeStage(w, h) {
  const v = { w, h };
  const scale = fitScale(v);
  document.documentElement.style.setProperty("--vw", v.w + "px");
  document.documentElement.style.setProperty("--vh", v.h + "px");
  document.documentElement.style.setProperty("--fit", String(scale));
  $("vpLabel").textContent = `${v.w} × ${v.h}` + (scale < 0.999 ? `  ·  ${Math.round(scale * 100)}%` : "");
  return scale;
}

function applyViewport({ refetch = true } = {}) {
  const v = viewport();
  const phone = $("phone");
  phone.className = "phone" + (device === "phone" ? "" : " " + device);
  sizeStage(v.w, v.h);
  $("turn").textContent = landscape ? "⟲ Portrait" : "⟲ Landscape";
  for (const b of document.querySelectorAll(".devices [data-dev]")) {
    b.classList.toggle("on", b.dataset.dev === device);
  }
  if (refetch) reframe();
}

// Re-lay the session's document at the viewport now chosen. The document is
// unchanged; only the size it is given changes.
async function reframe() {
  if (runMode) return; // Run mode paints from the app, not from /doc.
  const v = viewport();
  try {
    const d = await (await fetch(`/doc?w=${v.w}&h=${v.h}`)).json();
    if (d.error) return;
    paintFrame(d);
    paintMeasure(d.measure);
  } catch {
    /* the server will catch up on the next event */
  }
}

function clearPick() {
  for (const el of [...$("screen").querySelectorAll(".pickbox")]) el.remove();
}

async function pickAt(x, y) {
  try {
    const r = await fetch("/pick", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ x, y, width: lastWidth, height: lastHeight }),
    });
    const d = await r.json();
    if (d.error) {
      $("findings").replaceChildren(Object.assign(document.createElement("div"), { className: "bad", textContent: d.error }));
      return;
    }
    lastChain = d.chain || [];
    if (!lastChain.length) {
      clearPick();
      $("findings").replaceChildren(Object.assign(document.createElement("div"), { textContent: "nothing under that point" }));
      return;
    }
    showPick(lastChain.length - 1);
  } catch (e) {
    $("findings").replaceChildren(Object.assign(document.createElement("div"), { className: "bad", textContent: "pick: " + (e.message || e) }));
  }
}

function showPick(level) {
  const node = lastChain[level];
  if (!node) return;
  clearPick();
  const box = document.createElement("div");
  box.className = "pickbox";
  box.style.left = `${node.x}px`;
  box.style.top = `${node.y}px`;
  box.style.width = `${Math.max(node.w, 1)}px`;
  box.style.height = `${Math.max(node.h, 1)}px`;
  $("screen").appendChild(box);

  const chain = document.createElement("div");
  chain.className = "chain";
  lastChain.forEach((n, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = n.id ? `#${n.id}` : n.role ? `${n.tag}:${n.role}` : n.tag;
    b.title = n.class || n.tag;
    if (i === level) b.classList.add("on");
    b.addEventListener("click", () => showPick(i));
    chain.appendChild(b);
  });

  const lines = [`${node.at} — ${node.tag}${node.id ? " #" + node.id : ""}${node.role ? " role=" + node.role : ""}`];
  if (node.class) lines.push(node.class);
  if (node.text) lines.push(`"${node.text}"`);
  lines.push(`${Math.round(node.x)},${Math.round(node.y)} ${Math.round(node.w)}×${Math.round(node.h)} · ${node.children} child${node.children === 1 ? "" : "ren"}`);
  lines.push(`./evg-agent measure doc.evg.json --boxes --at=${node.at}`);

  $("findings").replaceChildren(chain, ...lines.map((t, i) => {
    const el = document.createElement("div");
    el.textContent = t;
    if (i === lines.length - 1) el.className = "ctx";
    return el;
  }));
}

function spin(on) {
  $("spin").classList.toggle("on", on);
}

function cursor() {
  const old = $("think").querySelector(".cursor");
  if (old) old.remove();
  const c = document.createElement("span");
  c.className = "cursor";
  return c;
}

// A reload is not a start-over either. The session's document is what the
// page shows when it opens; a fixture only when there is nothing there.
async function boot() {
  // Size the stage before the first paint, so the picture never appears at
  // one size and jump to another.
  applyViewport({ refetch: false });
  const v = viewport();
  try {
    const d = await (await fetch(`/doc?w=${v.w}&h=${v.h}`)).json();
    if (d.error) throw new Error(d.error);
    current = d.kind || current;
    paintFrame(d);
    paintMeasure(d.measure);
    $("added").textContent = "seed";
    $("kindLabel").textContent = current;
  } catch {
    await loadSeed(current);
  }
  refreshSaved();
}

boot();
</script>
