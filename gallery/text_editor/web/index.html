<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ranger EVG Text Editor (WebGL)</title>
    <style>
      @font-face {
        font-family: "Open Sans";
        src: url("/fonts/Open_Sans/OpenSans-Regular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "Open Sans Bold";
        src: url("/fonts/Open_Sans/OpenSans-Bold.ttf") format("truetype");
        font-weight: 700;
        font-style: normal;
      }
      @font-face {
        font-family: "Cinzel";
        src: url("/fonts/Cinzel/Cinzel-Regular.ttf") format("truetype");
        font-weight: 400;
      }
      @font-face {
        font-family: "Cinzel Bold";
        src: url("/fonts/Cinzel/Cinzel-Bold.ttf") format("truetype");
        font-weight: 700;
      }
      @font-face {
        font-family: "Josefin Sans";
        src: url("/fonts/Josefin_Sans/JosefinSans-Regular.ttf") format("truetype");
        font-weight: 400;
      }
      @font-face {
        font-family: "Josefin Sans Bold";
        src: url("/fonts/Josefin_Sans/JosefinSans-Bold.ttf") format("truetype");
        font-weight: 700;
      }
      :root {
        --bg: #0e1018;
        --panel: #161a26;
        --ink: #dce3f2;
        --muted: #8b97b0;
        --accent: #78c8ff;
        --btn: #1c2436;
        --btn-border: #3a4560;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background:
          radial-gradient(1200px 600px at 10% -10%, #1a2744 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 0%, #241828 0%, transparent 50%),
          var(--bg);
        color: var(--ink);
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .stage { width: min(960px, 100%); }
      h1 {
        margin: 0 0 6px;
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      p.hint {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 0.92rem;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin-bottom: 8px;
        padding: 8px;
        background: var(--panel);
        border: 1px solid #2a3348;
      }
      .toolbar button, .toolbar select {
        font: inherit;
        font-size: 0.82rem;
        color: var(--ink);
        background: var(--btn);
        border: 1px solid var(--btn-border);
        border-radius: 4px;
        padding: 5px 10px;
        cursor: pointer;
      }
      .toolbar button:hover, .toolbar select:hover {
        border-color: var(--accent);
      }
      .toolbar button.active {
        background: #243552;
        border-color: var(--accent);
        color: var(--accent);
      }
      .toolbar .sep {
        width: 1px;
        height: 22px;
        background: #2a3348;
        margin: 0 4px;
      }
      .frame {
        background: var(--panel);
        border: 1px solid #2a3348;
        padding: 10px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }
      .stack {
        position: relative;
        width: 720px;
        height: 480px;
      }
      .stack canvas {
        position: absolute;
        inset: 0;
        width: 720px;
        height: 480px;
        display: block;
      }
      #screen {
        background: #12141c;
        cursor: text;
        outline: none;
      }
      #overlay {
        pointer-events: none;
        background: transparent;
      }
      .bar {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        margin-top: 10px;
        color: var(--muted);
        font-size: 0.82rem;
      }
      .bar strong { color: var(--accent); font-weight: 600; }
      kbd {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.78rem;
        border: 1px solid #3a4560;
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 1px 5px;
        background: #1c2233;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <h1>Ranger EVG Text Editor</h1>
      <p class="hint">
        Double-click a word · drag to select · toolbar for Bold / Font / Align / Lists
        (canvas-editor-style). <kbd>Ctrl</kbd>+<kbd>B</kbd> · <kbd>Ctrl</kbd>+<kbd>A</kbd> · <kbd>Ctrl</kbd>+<kbd>Z</kbd>
      </p>
      <div class="toolbar" id="toolbar">
        <button type="button" data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
        <select id="fontSelect" title="Font" aria-label="Font">
          <option value="Open Sans">Open Sans</option>
          <option value="Cinzel">Cinzel</option>
          <option value="Josefin Sans">Josefin Sans</option>
        </select>
        <span class="sep"></span>
        <button type="button" data-cmd="align" data-arg="0" title="Align left">Left</button>
        <button type="button" data-cmd="align" data-arg="1" title="Align center">Center</button>
        <button type="button" data-cmd="align" data-arg="2" title="Align right">Right</button>
        <span class="sep"></span>
        <button type="button" data-cmd="list" data-arg="1" title="Bullet list">• List</button>
        <button type="button" data-cmd="list" data-arg="2" title="Numbered list">1. List</button>
      </div>
      <div class="frame">
        <div class="stack">
          <canvas id="screen" tabindex="0" width="720" height="480"></canvas>
          <canvas id="overlay" width="720" height="480"></canvas>
        </div>
      </div>
      <div class="bar">
        <span>status: <strong id="status">connecting…</strong></span>
        <span>backend: <strong id="backend">—</strong></span>
        <span>cmds: <strong id="cmds">—</strong></span>
        <span>fps: <strong id="fps">—</strong></span>
        <span>sel: <strong id="sel">—</strong></span>
      </div>
    </div>
    <script type="module" src="./client.mjs"></script>
  </body>
</html>
