<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ranger UI — WebGL vs DOM bench</title>
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: dark; --bg:#0b1020; --ink:#e6ebf5; --dim:#93a0bd; --line:#263049; }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        font: 13px/1.45 ui-sans-serif, system-ui, sans-serif;
      }
      header { padding: 12px 16px; border-bottom: 1px solid var(--line); }
      header h1 { margin: 0; font-size: 14px; font-weight: 600; }
      header p { margin: 4px 0 0; color: var(--dim); font-size: 12px; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
      section { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
      section h2 {
        margin: 0; padding: 8px 12px; font-size: 11px; letter-spacing: .08em;
        text-transform: uppercase; color: var(--dim); border-bottom: 1px solid var(--line);
      }
      #evg { display: block; width: 100%; background: #fff; }
      #dom {
        min-height: 320px; max-height: 600px; overflow: auto;
        background: #fff; color: #111; padding: 12px;
      }
      #dom button, #dom [role="checkbox"], #dom [role="button"] { margin: 2px; }
    </style>
  </head>
  <body>
    <header>
      <h1>WebGL vs DOM — render bench</h1>
      <p>
        Left: EVG controllers painted by <code>evg-webgl.js</code>.
        Right: the conformance Radix / TanStack / dnd-kit host.
        Drive it with <code>npm run ui:bench</code>.
      </p>
    </header>
    <main>
      <section>
        <h2>EVG · WebGL</h2>
        <canvas id="evg" width="900" height="600"></canvas>
      </section>
      <section>
        <h2>Radix · DOM</h2>
        <div id="dom"></div>
      </section>
    </main>
    <script type="module" src="./bundle-evg.js"></script>
    <script type="module" src="./bundle-dom.js"></script>
  </body>
</html>
