<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ranger UI — render stress</title>
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: dark; --bg:#0b1020; --ink:#e6ebf5; --dim:#93a0bd; --line:#263049; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 ui-sans-serif, system-ui, sans-serif; }
      header { padding: 12px 16px; border-bottom: 1px solid var(--line); }
      header h1 { margin: 0; font-size: 14px; }
      header p { margin: 4px 0 0; color: var(--dim); font-size: 12px; }
      canvas { display: block; background: #fff; margin: 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Ranger render stress</h1>
      <p>EVG only. Drive it with <code>npm run ui:bench:stress</code>.</p>
    </header>
    <canvas id="evg" width="900" height="600"></canvas>
    <script type="module" src="./bundle-stress.js"></script>
  </body>
</html>
