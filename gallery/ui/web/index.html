<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gallery/ui — Radix vs Ranger EVG</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --panel: #131a2e;
        --sidebar: #0e1526;
        --line: #263049;
        --ink: #e6ebf5;
        --dim: #93a0bd;
        --faint: #64748b;
        --ok: #34d399;
        --bad: #f87171;
        --accent: #60a5fa;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.5 ui-sans-serif, system-ui, "Noto Sans", sans-serif;
      }
      /* The viewport is the frame: the tree and the panels scroll on their own,
         so the sidebar never pushes the comparison off the screen. */
      #app { display: flex; flex-direction: column; height: 100vh; }

      header {
        display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
        padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
      }
      header h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 600; letter-spacing: .01em; }
      button {
        background: #1b2440; color: var(--ink); border: 1px solid var(--line);
        border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      label { display: inline-flex; gap: 6px; align-items: center; color: var(--dim); }
      .verdict { margin-left: auto; font-weight: 600; padding: 5px 12px; border-radius: 999px; }
      .verdict.ok { color: var(--ok); background: rgba(52,211,153,.12); }
      .verdict.bad { color: var(--bad); background: rgba(248,113,113,.12); }

      .body { display: grid; grid-template-columns: 250px 1fr; flex: 1; min-height: 0; overflow: hidden; }

      /* --- the tree --- */
      nav.tree {
        background: var(--sidebar); border-right: 1px solid var(--line);
        overflow-y: auto; padding: 10px 0 28px;
      }
      nav.tree .count {
        display: flex; justify-content: space-between; align-items: baseline;
        padding: 6px 14px 10px; color: var(--faint); font-size: 11px;
        text-transform: uppercase; letter-spacing: .09em;
      }
      nav.tree .group { margin-bottom: 2px; }
      nav.tree .group > .name {
        display: flex; justify-content: space-between; align-items: center;
        padding: 5px 14px; color: var(--dim); font-size: 12px; font-weight: 600;
        letter-spacing: .02em;
      }
      nav.tree .group > .name .n { color: var(--faint); font-weight: 400; font-size: 11px; }
      nav.tree button.spec {
        display: flex; align-items: center; gap: 8px; width: 100%;
        background: none; border: 0; border-radius: 0; text-align: left;
        padding: 4px 14px 4px 28px; color: var(--dim); font-size: 12.5px; cursor: pointer;
      }
      nav.tree button.spec:hover { background: #16203a; color: var(--ink); border-color: transparent; }
      nav.tree button.spec[aria-current="true"] {
        background: #1b2440; color: var(--ink);
        box-shadow: inset 2px 0 0 var(--accent);
      }
      nav.tree .dot { width: 7px; height: 7px; border-radius: 999px; background: #33405e; flex: none; }
      nav.tree .dot.ok { background: var(--ok); }
      nav.tree .dot.bad { background: var(--bad); }

      /* --- the panels --- */
      .content { display: flex; flex-direction: column; min-width: 0; overflow-y: auto; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); }
      section { background: var(--bg); padding: 16px 18px; min-width: 0; }
      section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 0 0 4px; }
      section p.sub { margin: 0 0 14px; color: var(--dim); font-size: 12px; }
      #radix { color: #111; background: #fff; border-radius: 8px; padding: 14px; }
      #radix button { font: inherit; margin: 2px; padding: 6px 10px; border-radius: 6px;
        border: 1px solid #cbd5e1; background: #f1f5f9; color: #0f172a; cursor: pointer; }
      #radix button[data-state="on"], #radix button[data-state="checked"],
      #radix button[data-state="active"] { background: #2563eb; color: #fff; border-color: #2563eb; }
      #radix button[data-state="indeterminate"] { background: #fbbf24; border-color: #fbbf24; }
      #radix button:disabled { opacity: .45; cursor: default; }
      #radix :focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
      canvas { border-radius: 8px; display: block; background: #fff; }
      canvas:focus { outline: 2px solid var(--accent); outline-offset: 2px; }

      .trace { border-top: 1px solid var(--line); padding: 14px 18px 40px; }
      table { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
      th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
      th { color: var(--dim); font-weight: 500; position: sticky; top: 0; background: var(--bg); }
      td.tid { color: var(--accent); }
      td.diff { color: var(--bad); font-weight: 600; }
      .scroll { overflow-x: auto; max-height: 40vh; overflow-y: auto; }
      .note { color: var(--dim); font-size: 12px; margin: 10px 0 0; max-width: 90ch; }
      code { background: #1b2440; padding: 1px 5px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./bundle.js"></script>
  </body>
</html>
