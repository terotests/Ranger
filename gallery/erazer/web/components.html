<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erazer HTML UI fixtures</title>
<style>
  :root {
    --bg: #e8ecf0;
    --card: #ffffff;
    --ink: #111827;
    --muted: #6b7280;
    --line: #d1d5db;
    --field: #e5e7eb;
    --accent: #2563eb;
    --accent-ink: #ffffff;
    --danger: #dc2626;
    --ok: #16a34a;
    --bar: #9ca3af;
    --tab: #e5e7eb;
    --menu: #dbeafe;
    --menu2: #e0e7ff;
    --menu3: #c7d2fe;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0f172a;
    color: var(--ink);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .page { padding: 24px; display: flex; flex-direction: column; gap: 28px; align-items: flex-start; }
  .shot { background: var(--bg); padding: 20px; }
  h2 { margin: 0 0 12px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #94a3b8; font-weight: 600; }
  .card {
    background: var(--card);
    border-radius: 10px;
    padding: 20px;
  }
  label.field { display: block; margin: 0 0 12px; }
  label.field span { display: block; font-size: 12px; font-weight: 600; margin: 0 0 6px; color: var(--ink); }
  input[type="text"], input[type="password"], input[type="search"] {
    display: block; width: 100%; height: 36px; padding: 0 10px;
    background: var(--field); border: 1px solid var(--line); border-radius: 6px;
    font: inherit; color: var(--ink);
  }
  .row { display: flex; align-items: center; gap: 10px; margin: 12px 0; }
  .check {
    width: 16px; height: 16px; border: 2px solid #374151; background: #fff; border-radius: 3px; flex: 0 0 16px;
  }
  .check.on { background: var(--accent); border-color: var(--accent); }
  button.primary, button.secondary, button.ghost, button.danger {
    height: 36px; padding: 0 16px; border-radius: 8px; font: inherit; font-weight: 600; cursor: default;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border: 0; }
  button.secondary { background: #f3f4f6; color: var(--ink); border: 1px solid var(--line); }
  button.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  button.danger { background: var(--danger); color: #fff; border: 0; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .tabs {
    display: flex; gap: 4px; background: var(--bar); padding: 4px; border-radius: 8px;
  }
  .tab { height: 36px; min-width: 88px; padding: 0 14px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; }
  .tab.on { background: #fff; color: var(--ink); }
  .tab.off { background: var(--tab); color: var(--ink); }
  .menu {
    background: #fff; border-radius: 8px; padding: 6px; width: 200px;
  }
  .item { height: 36px; border-radius: 6px; display: flex; align-items: center; padding: 0 12px; font-weight: 600; }
  .toolbar {
    display: flex; gap: 8px; align-items: center; background: #fff; border-radius: 10px; padding: 10px;
  }
  .toolbar input { width: 180px; }
  .iconbtn {
    width: 36px; height: 36px; border-radius: 8px; background: #111827; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700;
  }
  .dialog { width: 320px; }
  .dialog h3 { margin: 0 0 8px; font-size: 18px; }
  .dialog p { margin: 0 0 8px; color: var(--muted); }
  .btns { display: flex; gap: 8px; }
  .nav {
    width: 200px; background: #fff; border-radius: 10px; padding: 8px;
  }
  .nav .item:nth-child(1) { background: var(--menu); }
  .nav .item:nth-child(2) { background: var(--menu2); }
  .nav .item:nth-child(3) { background: var(--menu3); }
  .nav .item:nth-child(4) { background: #f1f5f9; }
</style>
</head>
<body>
<div class="page">

  <div>
    <h2>login form</h2>
    <div class="shot" id="login" data-shot="login" data-concept="form">
      <div class="card" style="width:320px" data-role="panel">
        <label class="field"><span data-role="label">Name</span><input type="text" value="" data-role="textfield"></label>
        <label class="field"><span data-role="label">Email</span><input type="text" value="" data-role="textfield"></label>
        <div class="row"><div class="check" data-role="checkbox"></div><span data-role="label">On</span></div>
        <div class="actions"><button class="primary" type="button" data-role="button">OK</button></div>
      </div>
    </div>
  </div>

  <div>
    <h2>settings checkboxes</h2>
    <div class="shot" id="settings" data-shot="settings" data-concept="property_row">
      <div class="card" style="width:320px">
        <div class="row"><div class="check on" data-role="checkbox"></div><span data-role="label">Mail</span></div>
        <div class="row"><div class="check" data-role="checkbox"></div><span data-role="label">Push</span></div>
        <div class="row"><div class="check on" data-role="checkbox"></div><span data-role="label">SMS</span></div>
      </div>
    </div>
  </div>

  <div>
    <h2>tabs</h2>
    <div class="shot" id="tabs" data-shot="tabs" data-concept="toolbar">
      <div class="tabs" style="width:320px">
        <div class="tab on" data-role="button">File</div>
        <div class="tab off" data-role="button">Edit</div>
        <div class="tab off" data-role="button">View</div>
      </div>
    </div>
  </div>

  <div>
    <h2>menu</h2>
    <div class="shot" id="menu" data-shot="menu" data-concept="list">
      <div class="menu">
        <div class="item" style="background:#dbeafe" data-role="label">File</div>
        <div class="item" style="background:#e0e7ff" data-role="label">Edit</div>
        <div class="item" style="background:#c7d2fe" data-role="label">View</div>
      </div>
    </div>
  </div>

  <div>
    <h2>toolbar</h2>
    <div class="shot" id="toolbar" data-shot="toolbar" data-concept="toolbar">
      <div class="toolbar">
        <input type="search" placeholder="" data-role="textfield">
        <button class="primary" type="button" data-role="button">Go</button>
        <div class="iconbtn" data-role="icon">+</div>
      </div>
    </div>
  </div>

  <div>
    <h2>dialog</h2>
    <div class="shot" id="dialog" data-shot="dialog" data-concept="card">
      <div class="card dialog" data-role="panel">
        <h3 data-role="label">Save</h3>
        <p data-role="label">Write the file now?</p>
        <div class="actions">
          <button class="ghost" type="button" data-role="button">No</button>
          <button class="primary" type="button" data-role="button">OK</button>
        </div>
      </div>
    </div>
  </div>

  <div>
    <h2>buttons</h2>
    <div class="shot" id="buttons" data-shot="buttons" data-concept="toolbar">
      <div class="btns">
        <button class="primary" type="button" data-role="button">Save</button>
        <button class="secondary" type="button" data-role="button">Edit</button>
        <button class="danger" type="button" data-role="button">Quit</button>
      </div>
    </div>
  </div>

  <div>
    <h2>sidebar nav</h2>
    <div class="shot" id="nav" data-shot="nav" data-concept="nav">
      <div class="nav">
        <div class="item" data-role="label">Home</div>
        <div class="item" data-role="label">Mail</div>
        <div class="item" data-role="label">Files</div>
        <div class="item" data-role="label">Quit</div>
      </div>
    </div>
  </div>

</div>
<script>
(function () {
  var shot = new URLSearchParams(location.search).get("shot");
  if (!shot) return;
  var el = document.querySelector('[data-shot="' + shot + '"]');
  if (!el) {
    document.body.textContent = "unknown shot: " + shot;
    return;
  }
  document.body.innerHTML = "";
  document.body.style.margin = "0";
  document.body.style.background = "#e8ecf0";
  document.body.appendChild(el);
  el.style.margin = "0";
  document.documentElement.setAttribute("data-size", el.offsetWidth + "x" + el.offsetHeight);
  document.documentElement.setAttribute("data-shot-ready", shot);
  document.title = el.offsetWidth + "x" + el.offsetHeight;
})();
</script>
</body>
</html>
