<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodeGraph — Ranger call graph</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font: 13px/1.4 "IBM Plex Sans", system-ui, sans-serif; }
    body { display: grid; grid-template-rows: 52px 1fr 28px;
           grid-template-columns: 280px 1fr;
           background: #eef1f6; color: #1a1f2b; }
    header { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center;
             padding: 0 14px; background: #1e293b; color: #f8fafc;
             border-bottom: 1px solid #0f172a; }
    header strong { font-size: 14px; letter-spacing: .3px; }
    header .crumb { color: #cbd5e1; font-size: 12px; flex: 1; min-width: 0;
                    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    header button, header select { font: inherit; padding: 4px 9px;
             border: 1px solid #475569; border-radius: 5px; background: #334155;
             color: #f8fafc; cursor: pointer; }
    header button:hover, header select:hover { border-color: #94a3b8; }
    header button:disabled { opacity: .4; cursor: default; }
    header button.on { background: #2563eb; border-color: #2563eb; }
    #rail { display: flex; flex-direction: column; min-height: 0;
            background: #fff; border-right: 1px solid #d5dae2; }
    #rail .cap { padding: 10px 12px 4px; color: #64748b; font-size: 11px;
                 letter-spacing: .08em; text-transform: uppercase; }
    #rail select { margin: 0 12px 8px; font: inherit; padding: 4px 6px; }
    #source { margin: 0 12px 8px; min-height: 140px; max-height: 36vh; resize: vertical;
              font: 11px/1.35 ui-monospace, "IBM Plex Mono", Menlo, monospace;
              border: 1px solid #d5dae2; border-radius: 4px; padding: 6px;
              background: #f8fafc; color: inherit; }
    #analyze { margin: 0 12px 10px; font: inherit; padding: 4px 9px;
               border: 1px solid #94a3b8; border-radius: 5px; background: #e8eef8;
               color: inherit; cursor: pointer; }
    #analyze:disabled { opacity: .5; cursor: default; }
    #classes { flex: 1; overflow: auto; padding: 0 6px 12px; }
    #classes button { display: block; width: 100%; text-align: left; font: inherit;
                      padding: 5px 8px; margin: 1px 0; border: 0; border-radius: 4px;
                      background: transparent; color: inherit; cursor: pointer; }
    #classes button:hover { background: #e8eef8; }
    #classes button.current { background: #2563eb; color: #fff; }
    #wrap { position: relative; min-width: 0; min-height: 0; background: #f7f8fa; }
    #screen { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    footer { grid-column: 1 / -1; display: flex; gap: 16px; align-items: center;
             padding: 0 14px; background: #fff; border-top: 1px solid #d5dae2;
             color: #64748b; font-variant-numeric: tabular-nums; font-size: 12px; }
    #selftest { display: none; }
    @media (max-width: 720px) {
      body { grid-template-columns: 1fr; grid-template-rows: 52px auto 1fr 28px; }
      #rail { max-height: 42vh; border-right: 0; border-bottom: 1px solid #d5dae2; }
      header { flex-wrap: wrap; height: auto; padding: 8px 12px; }
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #e2e8f0; }
      #rail, footer { background: #1e293b; border-color: #334155; }
      #wrap { background: #12151c; }
      #source { background: #0f172a; border-color: #334155; }
      #analyze { background: #334155; border-color: #475569; }
      #classes button:hover { background: #334155; }
    }
  </style>
</head>
<body>
  <header>
    <strong>CodeGraph</strong>
    <span class="crumb" id="crumb">loading…</span>
    <button type="button" id="back" title="Previous page">←</button>
    <button type="button" id="fwd" title="Next page">→</button>
    <button type="button" id="overview">overview</button>
    <button type="button" id="uml" title="UML compartments">UML</button>
    <button type="button" id="fit">fit</button>
    <button type="button" id="zoomSel" title="Frame the selected box so its name stays readable (~10 px)" disabled>zoom to selected</button>
    <button type="button" id="svg">SVG</button>
  </header>
  <aside id="rail">
    <div class="cap">example</div>
    <select id="sample" aria-label="example program">
      <option value="calls.rgr">calls.rgr — Order / LineItem</option>
      <option value="animals.rgr">animals.rgr — Farm / Animal</option>
      <option value="css">css — CssCore</option>
      <option value="evg">evg — EVGElement</option>
      <option value="zip">zip — ZipReader / ZipWriter</option>
      <option value="compiler">Ranger compiler (VirtualCompiler.rgr)</option>
      <option value="shop">Shop fixture (no compiler)</option>
      <option value="many">40 classes (paging)</option>
    </select>
    <textarea id="source" spellcheck="false" aria-label="Ranger source"></textarea>
    <button type="button" id="analyze">Analyze with VirtualCompiler</button>
    <div class="cap">classes</div>
    <div id="classes"></div>
  </aside>
  <div id="wrap">
    <canvas id="screen"></canvas>
  </div>
  <footer>
    <span id="status">loading…</span>
    <span id="backend">—</span>
    <span id="cmds">—</span>
    <span id="build">build __BUILD__</span>
  </footer>
  <pre id="selftest"></pre>
  <script src="./node-shim.js?v=__BUILD__"></script>
  <script src="./codegraph_web.js?v=__BUILD__"></script>
  <script type="module" src="./standalone.mjs?v=__BUILD__"></script>
</body>
</html>
