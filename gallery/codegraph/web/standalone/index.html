<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodeGraph — Ranger call graph</title>
  <style>
    html, body { margin: 0; height: 100%; background: #eef1f6; }
    #c { display: block; width: 100%; height: 100%; }
    #status, #backend, #crumb { position: absolute; left: -9999px; }
    #selftest { display: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <input id="open" type="file" accept=".rgr,.hpp,.h,.cpp,.cc,.ts,text/plain" multiple hidden>
  <span id="status">loading…</span>
  <span id="backend">—</span>
  <span id="crumb">loading…</span>
  <pre id="selftest"></pre>
  <script src="./node-shim.js?v=__BUILD__"></script>
  <script src="./codegraph_web.js?v=__BUILD__"></script>
  <script type="module" src="./standalone.mjs?v=__BUILD__"></script>
</body>
</html>
