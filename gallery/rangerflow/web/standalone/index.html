<meta charset="utf-8">
<title>RangerFlow — schema editor on the GPU</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; font: 13px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; background: #f7f8fa; color: #1f2430; }
  header { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
           padding: 8px 12px; border-bottom: 1px solid #d5dae2; background: #fff; }
  header strong { font-size: 14px; letter-spacing: .2px; }
  label { display: inline-flex; gap: 4px; align-items: center; color: #4b5563; }
  select, button, input[type=file] { font: inherit; }
  #tools { display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
           padding: 6px 12px; border-bottom: 1px solid #d5dae2; background: #fbfcfe; }
  #tools .group { display: inline-flex; gap: 4px; align-items: center; }
  #tools .cap { color: #6b7280; margin-right: 2px; }
  #tools button { min-width: 30px; padding: 3px 7px; border: 1px solid #ccd3dd;
                  border-radius: 5px; background: #fff; cursor: pointer; }
  #tools button:hover { border-color: #7c93b5; }
  #tools button.on { background: #2563eb; border-color: #2563eb; color: #fff; }
  #tools .shape { font-size: 15px; line-height: 1.1; }
  #rename { padding: 3px 6px; border: 1px solid #ccd3dd; border-radius: 5px; }
  /* The stage is the diagram and, when a format is being edited, the source
     beside it. Side by side rather than stacked: a textarea across the whole
     window costs the drawing the height it needs, and the drawing is the part
     you are looking at. */
  #stage { flex: 1; display: flex; min-height: 0; min-width: 0; }
  #wrap { flex: 1; position: relative; min-height: 0; min-width: 0; }
  #screen { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #typing { position: absolute; left: -9999px; top: 0; width: 1px; height: 1px;
            opacity: 0; border: 0; padding: 0; }
  footer { display: flex; gap: 16px; padding: 6px 12px; border-top: 1px solid #d5dae2;
           background: #fff; color: #6b7280; font-variant-numeric: tabular-nums; }
  #srcbox { display: flex; flex-direction: column; gap: 8px; padding: 8px 10px;
            width: 30vw; min-width: 280px; max-width: 560px; flex: 0 0 auto;
            border-right: 1px solid #d5dae2; background: #fbfcfe;
            /* Draggable in the browsers that allow it, and it never eats the
               canvas: `resize` is watched, so the drawing follows. */
            resize: horizontal; overflow: auto; }
  /* `display: flex` above beats the browser's own [hidden] rule, and the panel
     would take the canvas's room in every scenario. */
  #srcbox[hidden] { display: none; }
  #srcbox textarea { flex: 1; min-height: 140px; font: 12px/1.45 ui-monospace, SFMono-Regular,
                     Menlo, monospace; padding: 6px 8px; border: 1px solid #ccd3dd;
                     border-radius: 5px; resize: none; background: #fff; color: inherit; }
  #srcbox .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #srcbox .row label { gap: 4px; }
  #srcbox .hint { color: #6b7280; font-size: 12px; }
  #srcbox select { max-width: 100%; }
  #srcbox button { padding: 5px 9px; border: 1px solid #ccd3dd; border-radius: 5px;
                   background: #fff; cursor: pointer; font: inherit; }
  #srcbox button:hover { border-color: #7c93b5; }
  /* On a phone there is no room for two columns, so the source goes back on
     top — and takes a bounded slice rather than the whole screen. */
  @media (max-width: 720px) {
    #stage { flex-direction: column; }
    #srcbox { width: auto; max-width: none; flex: 0 0 40%; resize: none;
              border-right: 0; border-bottom: 1px solid #d5dae2; }
  }
  #selftest { white-space: pre-wrap; padding: 6px 12px; color: #111; background: #ffd; }
  @media (prefers-color-scheme: dark) {
    body { background: #12151c; color: #e6e9ef; }
    header, footer { background: #1b202a; border-color: #39414f; }
    #tools { background: #171c25; border-color: #39414f; }
    #tools button, #rename { background: #222833; border-color: #39414f; color: #e6e9ef; }
    #srcbox { background: #171c25; border-color: #39414f; }
    #srcbox textarea, #srcbox button { background: #222833; border-color: #39414f; color: #e6e9ef; }
    #srcbox .hint { color: #98a2b3; }
    #tools button.on { background: #2563eb; border-color: #2563eb; }
    label, footer { color: #98a2b3; }
  }
</style>

<header>
  <strong>RangerFlow</strong>
  <label>demo
    <select id="scenario">
      <option value="erd">database schema (ERD)</option>
      <option value="uml">UML class diagram</option>
      <option value="force">force layout (React Flow example)</option>
      <option value="flow">flowchart</option>
      <option value="atk">ATK-kaavio (ISO 5807)</option>
      <option value="mermaid">Mermaid (paste your own)</option>
      <option value="plantuml">PlantUML (paste your own)</option>
      <option value="graphviz">Graphviz DOT (paste your own)</option>
      <option value="org">organisaatiokaavio</option>
      <option value="process">uimaratakaavio</option>
      <option value="mindmap">mind map</option>
      <option value="radial">säteittäinen puu</option>
      <option value="activity">UML-aktiviteettikaavio</option>
    </select>
  </label>
  <label>layout
    <select id="layout">
      <option value="layered">layered</option>
      <option value="force">force (d3)</option>
      <option value="none">none (fixed)</option>
    </select>
  </label>
  <label>notation
    <select id="notation">
      <option value="crowfoot">crow's foot</option>
      <option value="uml">UML</option>
      <option value="plain">plain</option>
    </select>
  </label>
  <label>edges
    <select id="edgetype">
      <option value="smoothstep">smoothstep</option>
      <option value="step">step</option>
      <option value="default">bezier</option>
      <option value="straight">straight</option>
      <option value="curve">curve</option>
      <option value="metro">metro</option>
      <option value="oneside">one side</option>
    </select>
  </label>
  <label>background
    <select id="bg">
      <option value="1">dots</option>
      <option value="2">lines</option>
      <option value="3">cross</option>
      <option value="0">none</option>
    </select>
  </label>
  <label>theme
    <select id="theme">
      <option value="light">light</option>
      <option value="dark">dark</option>
    </select>
  </label>
  <label><input type="checkbox" id="snap"> snap</label>
  <label><input type="checkbox" id="rulers"> rulers</label>
  <label><input type="checkbox" id="bridges" checked> jumps</label>
  <button id="fit">fit</button>
  <button id="svg">download SVG</button>
  <label>open .sql <input type="file" id="file" accept=".sql,.txt"></label>
</header>

<div id="tools">
  <span class="group">
    <span class="cap">add</span>
    <button class="shape" data-shape="rect"          title="Process">▭</button>
    <button class="shape" data-shape="stadium"       title="Start / end">▢</button>
    <button class="shape" data-shape="diamond"       title="Decision">◇</button>
    <button class="shape" data-shape="parallelogram" title="Input / output">▱</button>
    <button class="shape" data-shape="cylinder"      title="Stored data">⛁</button>
    <button class="shape" data-shape="document"      title="Document">🗎</button>
    <button class="shape" data-shape="trapezoid"     title="Manual operation">⏢</button>
    <button class="shape" data-shape="hexagon"       title="Preparation">⬡</button>
    <button class="shape" data-shape="predefined"    title="Predefined process">▤</button>
    <button class="shape" data-shape="circle"        title="Connector">◯</button>
    <button class="shape" data-shape="note"          title="Note">🗅</button>
    <button class="shape" data-shape="sort"          title="Sort">⧫</button>
    <button class="shape" data-shape="collate"       title="Collate">⧗</button>
    <button class="shape" data-shape="or"            title="OR junction">⊕</button>
    <button class="shape" data-shape="papertape"     title="Paper tape">⌇</button>
    <button class="shape" data-shape="directdata"    title="Direct data">⬭</button>
    <button class="shape" data-shape="sequentialdata" title="Magnetic tape">⊙</button>
    <button class="shape" data-shape="multidocument" title="Multi-document">🗏</button>
    <button class="shape" data-shape="internalstorage" title="Internal storage">▦</button>
    <button class="shape" data-shape="action"        title="UML action">▢</button>
    <button class="shape" data-shape="sendsignal"    title="Send signal">▷</button>
    <button class="shape" data-shape="receivesignal" title="Receive signal">◁</button>
  </span>
  <span class="group">
    <button id="connect" title="Click a source node, then a target">connect</button>
    <button id="del" title="Delete the selection">delete</button>
    <button id="addrow" title="Add a column to the selected table">+ column</button>
    <button id="delrow" title="Drop a column from the selected table">− column</button>
    <button id="rotate" title="Turn the selection a quarter turn">rotate</button>
    <button id="dup" title="Duplicate the selection">duplicate</button>
    <button id="undo" title="Undo">undo</button>
    <button id="redo" title="Redo">redo</button>
  </span>
  <span class="group">
    <span class="cap">name</span>
    <input id="rename" type="text" placeholder="select a node" size="24" disabled>
  </span>
</div>

<div id="stage">

<!-- Text in, RangerFlow out. Both parsers are in the engine bundle, so this
     panel is a textarea and one method call; which reader gets the text is
     whatever the demo dropdown chose. -->
<div id="srcbox" hidden>
  <div class="row">
    <label id="examplelabel">example
      <select id="example"></select>
    </label>
    <button id="srcrender" type="button">render</button>
    <label title="redraw as you type"><input id="srclive" type="checkbox" checked> live</label>
  </div>
  <textarea id="srcarea" spellcheck="false" aria-label="diagram source"></textarea>
  <div class="row">
    <label>look
      <select id="srcstyle">
        <option value="default">default</option>
        <option value="forest">forest</option>
        <option value="dark">dark</option>
        <option value="neutral">neutral</option>
        <option value="print">print</option>
      </select>
    </label>
    <span class="hint" id="srchint"></span>
  </div>
</div>

<div id="wrap">
  <canvas id="screen"></canvas>
  <!-- A real text field, invisible and one pixel wide, that takes focus while
       a label is being typed. The canvas cannot receive composed characters,
       dead keys or a phone's keyboard; this can, and its value is mirrored
       into the editor on every input event. -->
  <input id="typing" type="text" autocomplete="off" autocorrect="off"
         autocapitalize="off" spellcheck="false" aria-label="edit label">
</div>

</div><!-- #stage -->

<footer>
  <span id="status">loading…</span>
  <span id="backend">—</span>
  <span id="cmds">—</span>
  <span id="fps">—</span>
  <span id="build">build __BUILD__</span>
</footer>
<pre id="selftest" hidden></pre>

<script src="./rangerflow_web.js?v=__BUILD__"></script>
<script type="module" src="./standalone.mjs?v=__BUILD__"></script>
