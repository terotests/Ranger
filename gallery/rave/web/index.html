<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d6efd'/%3E%3Crect x='7' y='8' width='18' height='4' rx='2' fill='%23fff'/%3E%3Crect x='7' y='14' width='6' height='10' rx='2' fill='%23fff'/%3E%3Crect x='15' y='14' width='10' height='10' rx='2' fill='%23fff'/%3E%3C/svg%3E" />
    <title>Rave — from UI to running app</title>
    <style>
      /* The page owns the pixels and nothing else. Every rail, row, panel and
         strip is an EVG element built by RaveEditor; the stage under them is
         the application itself, laid out by the same engine and drawn through
         a camera. This stylesheet paints the canvas it all lands on, and the
         canvas's background is the desk between the viewports. */
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
        background: #eceef2;
        font: 13px/1.45 "Inter", "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif; }
      #stage { position: relative; width: 100%; height: 100%; }
      #c { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
      #err { position: fixed; left: 12px; bottom: 34px; right: 12px; color: #c0392b;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
        white-space: pre-wrap; pointer-events: none; }
      #file { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
      /* The AI menu's fallback when the clipboard is not ours to read or
         write: a real textarea, over the canvas, that the browser will let a
         person copy out of and paste into. */
      .rave-paste { position: fixed; left: 50%; top: 50%; width: min(760px, 88vw);
        height: min(420px, 60vh); transform: translate(-50%, -50%);
        padding: 14px 16px; border: 1px solid #cfd4dd; border-radius: 12px;
        background: #ffffff; color: #1a1d21; z-index: 20;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
        box-shadow: 0 24px 60px rgba(20, 22, 26, 0.28); }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="c" tabindex="0"></canvas></div>
    <input id="file" type="file" accept=".json,.fig,application/json" />
    <div id="err"></div>
    <noscript>
      Rave: a UI design tool whose canvas objects are an application's
      structure — routes, layouts, components, a stylesheet with real
      breakpoints — drawn and run by Ranger's EVG engine. It needs JavaScript
      and WebGL 2.
    </noscript>
    <script type="module" src="./main.js"></script>
  </body>
</html>
