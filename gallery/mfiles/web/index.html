<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2310205a'/%3E%3Ctext x='5' y='22' font-family='Arial' font-weight='bold' font-size='16' fill='%235aa2ff'%3EM%3C/text%3E%3C/svg%3E"
    />
    <title>M-Files emulator — UIX extensions against a vault written in Ranger</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #eef0f4;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        overflow: hidden;
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #c {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none;
      }
      /* The Preview tab's viewer: beneath the app's canvas, which leaves a hole
         over it. Its events arrive through the app's canvas (main.js). */
      #pv {
        position: absolute;
        z-index: 0;
        display: none;
        pointer-events: none;
      }
      #err {
        position: fixed;
        left: 12px;
        bottom: 12px;
        right: 12px;
        color: #c0392b;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        pointer-events: none;
      }
      /* The code drawer: where a developer pastes an extension. It is plain DOM
         on purpose — a code editor is the one control this page does not need
         to draw itself. */
      #code {
        position: absolute;
        z-index: 30;
        display: none;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        box-sizing: border-box;
        background: #0f1629;
        color: #c9d4ff;
        border-left: 1px solid #253152;
      }
      #code.open {
        display: flex;
      }
      #code .row {
        display: flex;
        gap: 8px;
        align-items: center;
        min-width: 0;
      }
      #code .row > * {
        min-width: 0;
      }
      #code select {
        max-width: 55%;
      }
      #code select,
      #code input,
      #code button {
        font: 12px Arial, sans-serif;
        height: 28px;
        border-radius: 4px;
        border: 1px solid #3a4a78;
        background: #141d36;
        color: #c9d4ff;
        padding: 0 8px;
      }
      #code button {
        cursor: pointer;
      }
      #code button.primary {
        background: #5aa2ff;
        color: #0f1629;
        border-color: #5aa2ff;
      }
      /* The Ranger code editor: a canvas, and a textarea off to the side that
         takes the keyboard (code-editor.js). */
      #code-editor {
        position: relative;
        flex: 1;
        min-height: 0;
        border-radius: 4px;
        overflow: hidden;
        display: none;
      }
      #code-editor.ready {
        display: block;
      }
      #code-editor .code-canvas {
        display: block;
        touch-action: none;
      }
      #code-editor .code-keys {
        position: absolute;
        left: 0;
        top: 0;
        width: 1px;
        height: 1px;
        padding: 0;
        border: 0;
        opacity: 0;
        resize: none;
        overflow: hidden;
        pointer-events: none;
      }
      #code textarea#code-src {
        flex: 1;
        resize: none;
        border-radius: 4px;
        border: 1px solid #3a4a78;
        background: #0a0f1e;
        color: #e6ecff;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        padding: 10px;
        tab-size: 2;
        white-space: pre;
        overflow: auto;
        min-height: 0;
      }
      #code .hint {
        font-size: 11px;
        color: #7f8db3;
      }
      #code-status {
        min-height: 16px;
        font-size: 12px;
        color: #ffcf6b;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="pv" aria-hidden="true"></canvas><canvas id="c" tabindex="0"></canvas></div>
    <aside id="code" aria-label="Extension code">
      <div class="row">
        <select id="code-app" aria-label="Application"></select>
        <select id="code-version" aria-label="UIX version">
          <option value="2">UIX v2</option>
          <option value="1">UIX v1</option>
        </select>
        <input id="code-name" aria-label="Name" placeholder="Name" style="flex: 1" />
      </div>
      <div id="code-editor"></div>
      <textarea id="code-src" spellcheck="false" aria-label="Source"></textarea>
      <div class="row">
        <button id="code-run" class="primary" type="button">Load / restart</button>
        <button id="code-close" type="button">Back to metadata</button>
        <span class="hint">OnNewShellUI(shellUI) is the entry point · console.log goes to the console panel</span>
      </div>
      <div id="code-status"></div>
    </aside>
    <div id="err"></div>
    <noscript>
      This page is an M-Files client emulator — a vault, its gRPC API and the UIX v1/v2 extension frameworks, compiled from Ranger and
      running in the tab. It needs JavaScript and WebGL 2.
    </noscript>
    <script type="module" src="./main.js"></script>
  </body>
</html>
