<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Markdown — Ranger</title>
<style>
  :root {
    --bg: #eef0f4;
    --panel: #ffffff;
    --ink: #1f2328;
    --muted: #57606a;
    --line: #d8dee4;
    --accent: #0969da;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font: 13px/1.45 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overscroll-behavior: none;
  }
  /* `dvh` rather than `%`: on a phone the address bar changes the viewport,
     and a page sized to the tallest of them leaves a band of nothing. */
  #app { display: flex; flex-direction: column; height: 100dvh; min-height: 100%; }

  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 12px; background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    margin: 0 6px 0 0; font-size: 14px; font-weight: 600; letter-spacing: -0.01em;
  }
  button, select {
    font: inherit; padding: 5px 10px;
    border: 1px solid var(--line); border-radius: 6px;
    background: #fff; color: var(--ink); cursor: pointer;
  }
  button:hover:not(:disabled), select:hover { border-color: #b9c0cc; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
  #build { color: var(--muted); opacity: 0.7; }

  /* The commands. One row, one `data-cmd` each, and no rules in the page
     about what any of them mean — that is the module's table. */
  #toolbar {
    display: flex; align-items: center; gap: 2px; flex-wrap: wrap;
    padding: 5px 12px; background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  #toolbar button {
    min-width: 30px; padding: 4px 8px; border-radius: 5px;
    border: 1px solid transparent; background: transparent;
  }
  #toolbar button:hover:not(:disabled) { background: #eef1f5; border-color: var(--line); }
  #toolbar .sep { width: 1px; height: 18px; background: var(--line); margin: 0 6px; }
  #toolbar .b { font-weight: 700; }
  #toolbar .i { font-style: italic; }
  #toolbar .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }

  main { display: flex; flex: 1; min-height: 0; }
  #sourcePane {
    width: 38%; min-width: 240px; display: flex; flex-direction: column;
    border-right: 1px solid var(--line); background: var(--panel);
  }
  #source {
    flex: 1; width: 100%; resize: none; border: 0; outline: none;
    padding: 12px 14px; background: transparent; color: var(--ink);
    font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    tab-size: 4;
  }
  #viewPane { flex: 1; min-width: 0; position: relative; background: var(--bg); }
  /* The pane that does not own the keyboard says so. Both show the same
     document; only one is being typed into. */
  #source.readonly { background: #fafbfc; color: var(--muted); }

  /* Which page a reader is on, over the paper rather than beside it: the
     window is the document and the number belongs on it, the way a reader's
     thumb marks a place. It follows the scroll, and it is also how you jump. */
  #pagebar {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    display: none; align-items: center; gap: 2px; z-index: 2;
    padding: 3px 4px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.92); border: 1px solid var(--line);
    box-shadow: 0 1px 6px rgba(16, 22, 26, 0.12);
    backdrop-filter: blur(6px);
  }
  #pagebar.on { display: flex; }
  #pagebar button {
    border: 0; background: transparent; padding: 2px 7px; border-radius: 999px;
    color: var(--muted); line-height: 1;
  }
  #pagebar button:hover:not(:disabled) { background: #eef1f5; color: var(--ink); }
  #pageno {
    font-variant-numeric: tabular-nums; padding: 0 6px; color: var(--ink);
  }
  #pageno input {
    width: 2.4em; text-align: right; font: inherit; padding: 1px 2px;
    border: 1px solid transparent; border-radius: 4px; background: transparent;
    color: inherit;
  }
  #pageno input:focus { border-color: var(--line); background: #fff; outline: none; }

  /* A canvas cannot receive typed text, an IME composition or a paste. This
     field can, and is what the drawing pane actually focuses. It must stay in
     the layout and stay focusable — `display:none` or `hidden` would take it
     out of both — so it is one transparent pixel under the drawing. */
  #keys {
    position: absolute; top: 0; left: 0; width: 1px; height: 1px;
    padding: 0; border: 0; outline: none; opacity: 0; resize: none;
    overflow: hidden; white-space: pre; z-index: 1;
  }
  #screen { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #screen:focus { outline: none; }

  #hint {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    color: var(--muted); text-align: center; pointer-events: none;
  }

  /* The chrome folds on a phone: the source above, the drawing below. */
  @media (max-width: 720px) {
    main { flex-direction: column; }
    #sourcePane { width: 100%; height: 40%; border-right: 0; border-bottom: 1px solid var(--line); }
    #toolbar { padding: 4px 8px; }
    #viewPane { flex: 1; }
    header h1 { width: 100%; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Markdown, drawn by EVG</h1>
    <select id="sample" title="Open a document">
      <option value="mermaid">with diagrams</option>
      <option value="diagrams">three notations</option>
      <option value="deck">a company deck</option>
      <option value="sample">a bit of everything</option>
      <option value="readme">this repository's README</option>
    </select>
    <button id="openFile" type="button">open .md…</button>
    <select id="theme" title="The company template, as a stylesheet">
      <option value="">no template</option>
      <option value="corporate">corporate.css</option>
      <option value="editorial">editorial.css</option>
    </select>
    <select id="mode" title="How the document is laid out">
      <option value="scroll">continuous</option>
      <option value="paged">paged</option>
    </select>
    <select id="pageshape" title="The sheet" disabled>
      <option value="a4">A4 portrait</option>
      <option value="a4 landscape">A4 landscape</option>
      <option value="letter">Letter portrait</option>
      <option value="letter landscape">Letter landscape</option>
      <option value="a5">A5 portrait</option>
      <option value="a5 landscape">A5 landscape</option>
      <option value="a3">A3 portrait</option>
      <option value="a3 landscape">A3 landscape</option>
    </select>
    <button id="pdf" type="button">⬇ PDF</button>
    <button id="html" type="button">⬇ HTML</button>
    <span id="status">starting…</span>
    <span id="build">build __BUILD__</span>
  </header>
  <div id="toolbar" role="toolbar" aria-label="Formatting">
    <button type="button" class="b" data-cmd="format.bold" title="Bold (Ctrl+B)">B</button>
    <button type="button" class="i" data-cmd="format.italic" title="Italic (Ctrl+I)">I</button>
    <button type="button" class="m" data-cmd="format.code" title="Code (Ctrl+E)">&lt;/&gt;</button>
    <button type="button" data-cmd="format.strike" title="Strikethrough"><s>S</s></button>
    <button type="button" data-cmd="format.link" title="Link">🔗</button>
    <span class="sep"></span>
    <button type="button" data-cmd="block.heading" data-arg="1" title="Heading 1">H1</button>
    <button type="button" data-cmd="block.heading" data-arg="2" title="Heading 2">H2</button>
    <button type="button" data-cmd="block.heading" data-arg="3" title="Heading 3">H3</button>
    <button type="button" data-cmd="block.heading" data-arg="0" title="Plain paragraph">¶</button>
    <span class="sep"></span>
    <button type="button" data-cmd="block.bullet" title="Bullet list">• list</button>
    <button type="button" data-cmd="block.ordered" title="Numbered list">1. list</button>
    <button type="button" data-cmd="block.quote" title="Block quote">❝</button>
    <span class="sep"></span>
    <button type="button" data-cmd="edit.undo" title="Undo (Ctrl+Z)">↶</button>
    <button type="button" data-cmd="edit.redo" title="Redo (Ctrl+Y)">↷</button>
  </div>
  <main>
    <div id="sourcePane">
      <textarea id="source" spellcheck="false" aria-label="Markdown source"></textarea>
    </div>
    <div id="viewPane">
      <canvas id="screen" aria-label="The document, drawn"></canvas>
      <textarea id="keys" spellcheck="false" autocapitalize="off" autocomplete="off"
                aria-label="The document — type here to edit it"></textarea>
      <div id="pagebar" role="group" aria-label="Page">
        <button id="pageprev" type="button" title="Previous page">‹</button>
        <span id="pageno"><input id="pagenum" type="text" inputmode="numeric"
                                 aria-label="Page number" value="1" /> / <span id="pagetotal">1</span></span>
        <button id="pagenext" type="button" title="Next page">›</button>
      </div>
      <div id="hint">loading the engine…</div>
    </div>
  </main>
</div>
<input id="filepick" type="file" accept=".md,.markdown,text/markdown,text/plain" hidden />
<script src="./markdown_web.js?v=__BUILD__"></script>
<script type="module" src="./standalone.mjs?v=__BUILD__"></script>
</body>
</html>
